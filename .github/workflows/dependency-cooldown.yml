name: Dependency Cooldown

# Blocks Dependabot PRs that bump any npm package to a version published less
# than 14 days ago. This closes the zero-day supply-chain window where a
# compromised maintainer account pushes a malicious patch and Dependabot
# proposes it before any advisory exists.
#
# Bypass: apply the `skip-cooldown` label to the PR (maintainer-only).
#
# See also: .ai/specs/briefs/2026-08-09-dependabot-cooldown-ci-gate.md

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'yarn.lock'

concurrency:
  group: dependency-cooldown-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cooldown-check:
    name: Publish-age check (14 days)
    if: >-
      github.actor == 'dependabot[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-cooldown')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout base branch lockfile
        run: git show origin/${{ github.event.pull_request.base.ref }}:yarn.lock > yarn.lock.base

      - name: Check publish age of bumped packages
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            const COOLDOWN_DAYS = 14
            const COOLDOWN_MS = COOLDOWN_DAYS * 24 * 60 * 60 * 1000

            // Parse yarn.lock v2+ (Berry) resolution lines and their version fields.
            // Format: "pkg@npm:version" blocks with `version:` lines.
            function parseYarnLock(content) {
              const versions = new Map()
              let currentPkg = null

              for (const line of content.split('\n')) {
                // Match resolution header: "package@npm:^x.y.z":
                const headerMatch = line.match(/^"?(@?[^@\s]+)@npm:/)
                if (headerMatch) {
                  currentPkg = headerMatch[1]
                  continue
                }

                // Match version line inside a block
                const versionMatch = line.match(/^\s+version:\s+"?([^"\s]+)"?/)
                if (versionMatch && currentPkg) {
                  versions.set(`${currentPkg}@${versionMatch[1]}`, {
                    name: currentPkg,
                    version: versionMatch[1],
                  })
                  currentPkg = null
                }
              }

              return versions
            }

            const baseLock = fs.readFileSync('yarn.lock.base', 'utf8')
            const headLock = fs.readFileSync('yarn.lock', 'utf8')

            const baseVersions = parseYarnLock(baseLock)
            const headVersions = parseYarnLock(headLock)

            // Find packages that are new or changed version
            const bumped = []
            for (const [key, pkg] of headVersions) {
              if (!baseVersions.has(key)) {
                bumped.push(pkg)
              }
            }

            if (bumped.length === 0) {
              core.info('No version bumps detected in yarn.lock.')
              return
            }

            core.info(`Found ${bumped.length} bumped package(s). Checking publish dates…`)

            const tooYoung = []
            const now = Date.now()

            // Deduplicate by name@version
            const seen = new Set()
            for (const pkg of bumped) {
              const key = `${pkg.name}@${pkg.version}`
              if (seen.has(key)) continue
              seen.add(key)

              try {
                const encodedName = pkg.name.startsWith('@')
                  ? `@${encodeURIComponent(pkg.name.slice(1).replace('/', '%2F'))}`
                  : encodeURIComponent(pkg.name)
                const url = `https://registry.npmjs.org/${pkg.name.replace('/', '%2f')}`

                const res = await fetch(url)
                if (!res.ok) {
                  core.warning(`Could not fetch registry data for ${pkg.name}: HTTP ${res.status}`)
                  continue
                }

                const data = await res.json()
                const publishTime = data.time?.[pkg.version]

                if (!publishTime) {
                  core.warning(`No publish timestamp found for ${key} — skipping`)
                  continue
                }

                const publishDate = new Date(publishTime)
                const ageMs = now - publishDate.getTime()
                const ageDays = Math.floor(ageMs / (24 * 60 * 60 * 1000))

                if (ageMs < COOLDOWN_MS) {
                  tooYoung.push({ name: pkg.name, version: pkg.version, ageDays, publishDate: publishDate.toISOString() })
                  core.error(`${key} was published ${ageDays} day(s) ago (${publishDate.toISOString()}) — minimum is ${COOLDOWN_DAYS} days`)
                } else {
                  core.info(`${key} — ${ageDays} days old ✓`)
                }
              } catch (err) {
                core.warning(`Failed to check ${key}: ${err.message}`)
              }
            }

            if (tooYoung.length > 0) {
              const summary = tooYoung.map(p => `- \`${p.name}@${p.version}\` — published ${p.ageDays} day(s) ago (${p.publishDate})`).join('\n')
              core.summary.addHeading('Dependency Cooldown — blocked', 2)
              core.summary.addRaw(`The following package(s) were published less than ${COOLDOWN_DAYS} days ago:\n\n${summary}\n\n`)
              core.summary.addRaw('**To bypass**, apply the `skip-cooldown` label (maintainer-only) and re-run this check.\n')
              core.summary.addRaw(`**To wait**, this PR will pass once all versions are at least ${COOLDOWN_DAYS} days old.\n`)
              await core.summary.write()
              core.setFailed(`${tooYoung.length} package(s) failed the ${COOLDOWN_DAYS}-day cooldown check.`)
            } else {
              core.summary.addHeading('Dependency Cooldown — passed', 2)
              core.summary.addRaw(`All bumped packages are at least ${COOLDOWN_DAYS} days old. ✓\n`)
              await core.summary.write()
            }
