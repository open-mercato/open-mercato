name: QA ready label

on:
  pull_request_target:
    types: [opened, synchronize, reopened, converted_to_draft, ready_for_review, labeled, unlabeled]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Keeps the human QA labels current (see .ai/docs/pr-workflow.md).
#
# 1. Classification backstop: an open PR that asks for QA (`needs-qa`, no
#    `skip-qa`) and falls under the human-only policy (`security`, `feature`
#    or `risk-high`, or authored by the UX owner) gets `needs-human-qa`, so a
#    protected PR never loses the human QA gate because nobody classified it.
#    This job only adds that label; it never removes it.
# 2. `ready-for-qa` means a human tester can start now: approving review,
#    green CI, no conflicts, and no human QA sign-off on the current head yet.
#    A push removes it at once, so a QA verdict is never based on code that
#    has since changed; the schedule adds it back once the new head is
#    approved and green again. It is a queue hint only: merge tooling checks
#    `qa-approved` and the `QA head:` line itself and never trusts this label.
#
# A sign-off counts only when the latest QA verdict comment on the PR comes
# from someone with triage or higher permission who is not the PR author,
# says READY TO MERGE, and pins the full 40-character current head SHA.
#
# pull_request_target runs in the base repository context so fork pull
# requests can be relabeled. There is no checkout: no pull request head and no
# contributor-supplied code ever reaches this job.
permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: qa-ready-label-${{ github.event.pull_request.number || 'scan' }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'pull_request_target' || github.event.action != 'labeled' || github.event.label.name != 'ready-for-qa'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Sync needs-human-qa and ready-for-qa
        uses: actions/github-script@v9
        with:
          script: |
            const GATE = 'needs-human-qa';
            const READY = 'ready-for-qa';
            const AUTO_QA = 'needs-qa';
            const OPT_OUT = 'skip-qa';
            const HOLDS = ['blocked', 'do-not-merge', 'qa-failed', 'skip-qa'];
            const HUMAN_ONLY_LABELS = ['security', 'feature', 'risk-high'];
            const HUMAN_ONLY_AUTHORS = ['zielivia'];
            const SIGNOFF_ROLES = ['admin', 'maintain', 'write', 'triage'];
            const { owner, repo } = context.repo;

            const prQuery = `query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $number) {
                  number state isDraft mergeable reviewDecision headRefOid
                  author { login }
                  labels(first: 100) { nodes { name } }
                  commits(last: 1) { nodes { commit { statusCheckRollup { state } } } }
                }
              }
            }`;

            async function loadPr(number) {
              const result = await github.graphql(prQuery, { owner, repo, number });
              return result.repository.pullRequest;
            }

            function needsGate(pr, labels) {
              if (pr.state !== 'OPEN') return false;
              if (labels.includes(GATE) || labels.includes(OPT_OUT) || !labels.includes(AUTO_QA)) return false;
              const author = pr.author?.login ?? '';
              return HUMAN_ONLY_LABELS.some((label) => labels.includes(label)) || HUMAN_ONLY_AUTHORS.includes(author);
            }

            const roleCache = new Map();
            async function canSignOff(login) {
              if (!roleCache.has(login)) {
                let role = 'none';
                try {
                  const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: login });
                  role = data.role_name ?? data.permission ?? 'none';
                } catch (error) {
                  core.info(`permission lookup for ${login} failed: ${error.message}`);
                }
                roleCache.set(login, SIGNOFF_ROLES.includes(role));
              }
              return roleCache.get(login);
            }

            async function signedOffOnHead(pr) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });
              const prAuthor = pr.author?.login ?? '';
              for (const comment of comments.reverse()) {
                const login = comment.user?.login ?? '';
                if (!login || comment.user?.type === 'Bot' || login === prAuthor) continue;
                const body = comment.body ?? '';
                const verdict = /QA verdict:[^\n]*/i.exec(body)?.[0];
                if (!verdict) continue;
                if (!(await canSignOff(login))) continue;
                const pinned = /QA head:\s*`?([0-9a-f]{40})\b/i.exec(body)?.[1]?.toLowerCase();
                return /READY TO MERGE/i.test(verdict) && pinned === pr.headRefOid.toLowerCase();
              }
              return false;
            }

            async function readiness(pr, labels) {
              if (pr.state !== 'OPEN' || pr.isDraft) return 'not open or draft';
              if (!labels.includes(GATE)) return `no ${GATE}`;
              const hold = HOLDS.find((label) => labels.includes(label));
              if (hold) return `held by ${hold}`;
              const approved = pr.reviewDecision === 'APPROVED' || labels.includes('automerge-signal-1-cr');
              if (!approved) return 'no approving review';
              const ci = pr.commits.nodes[0]?.commit.statusCheckRollup?.state;
              if (ci !== 'SUCCESS') return `CI is ${ci ?? 'missing'}`;
              if (pr.mergeable === 'CONFLICTING') return 'conflicts';
              if (pr.mergeable !== 'MERGEABLE') return 'mergeability unknown';
              if (labels.includes('qa-approved') && (await signedOffOnHead(pr))) return 'QA already signed off this head';
              return null;
            }

            async function sync(number, { removeOnly = false } = {}) {
              const pr = await loadPr(number);
              const labels = pr.labels.nodes.map((label) => label.name);
              if (needsGate(pr, labels)) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [GATE] });
                labels.push(GATE);
                core.info(`#${number}: added ${GATE} (human-only policy)`);
              }
              const has = labels.includes(READY);
              const reason = removeOnly ? 'new commits' : await readiness(pr, labels);
              if (reason && has) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: READY });
                core.info(`#${number}: removed ${READY} (${reason})`);
              } else if (!reason && !has) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [READY] });
                core.info(`#${number}: added ${READY}`);
              } else {
                core.info(`#${number}: unchanged (${reason ?? 'ready'})`);
              }
            }

            if (context.eventName === 'pull_request_target') {
              const number = context.payload.pull_request.number;
              const removeOnly = ['synchronize', 'reopened', 'converted_to_draft'].includes(context.payload.action);
              await sync(number, { removeOnly });
              return;
            }

            const queries = [
              `label:"${GATE}"`,
              `label:"${READY}"`,
              ...HUMAN_ONLY_LABELS.map((label) => `label:"${AUTO_QA}" label:"${label}" -label:"${GATE}"`),
              ...HUMAN_ONLY_AUTHORS.map((login) => `label:"${AUTO_QA}" author:${login} -label:"${GATE}"`),
            ];
            const numbers = new Set();
            for (const query of queries) {
              const items = await github.paginate(github.rest.search.issuesAndPullRequests, {
                q: `repo:${owner}/${repo} is:pr is:open ${query}`,
                per_page: 100,
              });
              for (const item of items) numbers.add(item.number);
            }
            core.info(`Checking ${numbers.size} pull requests`);
            for (const number of numbers) {
              try {
                await sync(number);
              } catch (error) {
                core.warning(`#${number}: ${error.message}`);
              }
            }
