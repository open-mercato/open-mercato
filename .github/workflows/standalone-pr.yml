name: Standalone PR Compatibility

on:
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  standalone-pr:
    name: Standalone PR Integration Tests
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 150
    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie
        env:
          POSTGRES_USER: mercato
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: mercato_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      - name: Enable Corepack
        run: corepack enable

      - name: Install monorepo dependencies
        run: yarn install --immutable

      - name: Build PR packages
        run: |
          yarn build:packages
          yarn generate
          yarn build:packages

      - name: Install Playwright
        run: yarn playwright install --with-deps chromium

      - name: Test PR packages in a production standalone app
        env:
          STANDALONE_BASE_REF: ${{ github.event.pull_request.base.sha || github.sha }}
        run: >-
          node scripts/ci/standalone-integration.mjs --source local
          --app-dir /tmp/standalone-app --suite affected --base-ref "$STANDALONE_BASE_REF"

      - name: Upload standalone evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: standalone-pr-results
          path: |
            .ai/qa/test-results/html/
            .ai/qa/test-results/artifacts/
            .ai/qa/test-results/results.json
            .ai/qa/test-results/standalone-selection.json
            /tmp/standalone-app.log
          if-no-files-found: ignore
