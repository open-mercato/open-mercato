name: Deploy to Dokploy QA

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "QA slot to deploy to"
        required: true
        type: choice
        options:
          - qa1
          - qa2
          - qa3
          - qa4

      branch:
        description: "Branch to build and deploy"
        required: true
        type: string

      pr_number:
        description: "Optional PR number to label/comment (e.g. 123)"
        required: false
        type: string

permissions:
  contents: read
  packages: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: dokploy-${{ github.event.inputs.slot }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERFILE: ./docker/preview/Dockerfile
  BUILD_CONTEXT: .

jobs:
  deploy:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Validate PR number (optional)
        id: validate_pr
        if: ${{ github.event.inputs.pr_number != '' }}
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^0*([1-9][0-9]*)$ ]]; then
            echo "pr_number must be a positive integer"
            exit 1
          fi
          NORMALIZED_PR_NUMBER="${BASH_REMATCH[1]}"
          if [[ ${#NORMALIZED_PR_NUMBER} -gt 16 ]] || (( NORMALIZED_PR_NUMBER > 9007199254740991 )); then
            echo "pr_number exceeds the safe integer range"
            exit 1
          fi
          echo "pr_number=$NORMALIZED_PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: ${{ env.DOCKERFILE }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        shell: bash
        env:
          SLOT: ${{ github.event.inputs.slot }}
        run: |
          set -euo pipefail

          SHA="${GITHUB_SHA}"
          SHORT_SHA="${SHA:0:7}"

          TAG="${SLOT}-${SHORT_SHA}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "image_full=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: useblacksmith/build-push-action@v2
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image_full }}

      - name: Resolve Dokploy applicationId
        id: app
        shell: bash
        env:
          SLOT: ${{ steps.meta.outputs.slot }}
        run: |
          set -euo pipefail

          case "$SLOT" in
            qa1)
              APP_ID="${{ vars.DOKPLOY_APP_ID_QA1 }}"
              ;;
            qa2)
              APP_ID="${{ vars.DOKPLOY_APP_ID_QA2 }}"
              ;;
            qa3)
              APP_ID="${{ vars.DOKPLOY_APP_ID_QA3 }}"
              ;;
            qa4)
              APP_ID="${{ vars.DOKPLOY_APP_ID_QA4 }}"
              ;;
            *)
              echo "Unknown slot: $SLOT"
              exit 1
              ;;
          esac

          if [[ -z "$APP_ID" ]]; then
            echo "Missing Dokploy app id for $SLOT"
            exit 1
          fi

          echo "application_id=$APP_ID" >> "$GITHUB_OUTPUT"

      - name: Update image in Dokploy
        shell: bash
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          APP_ID: ${{ steps.app.outputs.application_id }}
          DOCKER_IMAGE: ${{ steps.meta.outputs.image_full }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$GHCR_USERNAME" || -z "$GHCR_TOKEN" ]]; then
            echo "Missing GHCR_USERNAME or GHCR_TOKEN secret"
            exit 1
          fi

          curl -fsS -X POST "${DOKPLOY_URL}/api/application.saveDockerProvider" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg applicationId "$APP_ID" \
              --arg dockerImage "$DOCKER_IMAGE" \
              --arg registryUrl "ghcr.io" \
              --arg username "$GHCR_USERNAME" \
              --arg password "$GHCR_TOKEN" \
              '{
                applicationId: $applicationId,
                dockerImage: $dockerImage,
                registryUrl: $registryUrl,
                username: $username,
                password: $password
              }')"

      - name: Trigger Dokploy deploy
        shell: bash
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          APP_ID: ${{ steps.app.outputs.application_id }}
        run: |
          set -euo pipefail

          curl -fsS -X POST "${DOKPLOY_URL}/api/application.deploy" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg applicationId "$APP_ID" '{applicationId: $applicationId}')"

      - name: Add QA label to PR
        if: ${{ github.event.inputs.pr_number != '' }}
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.validate_pr.outputs.pr_number }}
          SLOT: ${{ steps.meta.outputs.slot }}
        with:
          script: |
            const pr = Number(process.env.PR_NUMBER);
            const slot = process.env.SLOT;
            const label = `qa:${slot}`;

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              labels: [label],
            });

      - name: Comment on PR with QA marker
        if: ${{ github.event.inputs.pr_number != '' }}
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.validate_pr.outputs.pr_number }}
          SLOT: ${{ steps.meta.outputs.slot }}
          IMAGE: ${{ steps.meta.outputs.image_full }}
          BRANCH: ${{ github.event.inputs.branch }}
        with:
          script: |
            const pr = Number(process.env.PR_NUMBER);
            const slot = process.env.SLOT;
            const image = process.env.IMAGE;
            const branch = process.env.BRANCH;

            // Marker format: DO NOT change lightly (cleanup workflow parses it)
            const marker = `<!-- dokploy-qa slot=${slot} image=${image} -->`;

            const body = [
              marker,
              `🚀 Deployed to **${slot}**`,
              ``,
              `- Image: \`${image}\``,
              `- Branch: \`${branch}\``,
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body,
            });
