name: Release

# Starts the next version of ONE release line (CONTRIBUTING.md § Releasing). Run it from the
# `release/vX.Y.x` branch you want to ship — the "Use workflow from" picker is the only input that
# matters. `main` is never released directly: cut a line from it with release-cut.yml.
#
# Bump first, then publish: `scripts/release-line.mts prepare` picks the version (a fresh line's
# x.y.0 as committed, otherwise the next patch past every taken tag), stamps the release set and
# CHANGELOG.md, commits that bump to the line and tags it `vX.Y.Z` as the release app. That tag
# starts release-publish.yml AT the tagged commit — so the npm provenance it signs names exactly
# the commit it builds — which builds, publishes and creates the GitHub Release.
#
# This workflow publishes nothing. A dry run rehearses the build and the release notes instead.
# A version is done once its GitHub Release exists; a run that finds the line's newest tag without
# one stops and points at the Release publish run to re-run for that tag.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute the version and rehearse the build without committing, tagging or publishing anything'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # workflow_dispatch reads this file from the ref it runs on: dispatch from the line's BRANCH.
    if: startsWith(github.ref, 'refs/heads/release/v')
    env:
      HUSKY: '0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The line's current tip, not the dispatch SHA: "Re-run jobs" replays the dispatch SHA,
          # which predates a bump commit an earlier attempt already pushed to the line.
          ref: ${{ github.ref_name }}
          fetch-depth: 0  # every v* tag: the next version is chosen from them

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      # Commits and tags through the GitHub API as the release app, which sits on the `release/v*`
      # ruleset's bypass list. A tag the app creates triggers release-publish.yml; one created with
      # GITHUB_TOKEN would not.
      - name: Mint the release token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Bump and tag the release line
        id: prepare
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/release-line.mts prepare ${{ inputs.dry_run && '--dry-run' || '' }}

      # The rehearsal builds what would ship: the locally stamped tree for a fresh dry run, the
      # tagged commit when the line has a tagged-but-unreleased version.
      - name: Check out the tagged commit
        if: ${{ inputs.dry_run && steps.prepare.outputs.resumed == 'true' }}
        env:
          SHA: ${{ steps.prepare.outputs.sha }}
        run: |
          git fetch --no-tags origin "$SHA"
          git checkout --force --detach "$SHA"

      - name: Enable Corepack
        if: ${{ inputs.dry_run }}
        run: corepack enable

      - name: Install dependencies
        if: ${{ inputs.dry_run }}
        run: yarn install --immutable

      - name: Verify version alignment
        if: ${{ inputs.dry_run }}
        run: ./scripts/check-version-alignment.sh --reference package.json

      - name: Rehearse the build
        if: ${{ inputs.dry_run }}
        run: |
          yarn build:packages
          yarn generate
          yarn build:packages

      - name: Preview the GitHub Release
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          SHA: ${{ steps.prepare.outputs.sha }}
          DIST_TAG: ${{ steps.prepare.outputs.distTag }}
        run: node scripts/release-line.mts announce --dry-run --version "$VERSION" --sha "$SHA" --dist-tag "$DIST_TAG"

      - name: Write workflow summary
        if: always() && steps.prepare.outputs.version != ''
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          DIST_TAG: ${{ steps.prepare.outputs.distTag }}
          CHANGELOG_SOURCE: ${{ steps.prepare.outputs.changelog }}
          RESUMED: ${{ steps.prepare.outputs.resumed }}
          DRY_RUN: ${{ inputs.dry_run }}
          PUBLISH_RUNS: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/release-publish.yml
        run: |
          {
            echo "## 🏷️ v${VERSION} from ${GITHUB_REF_NAME}"
            echo ""
            echo "- Dist-tag (as of now): \`${DIST_TAG}\`"
            echo "- Changelog entry: ${CHANGELOG_SOURCE}"
            echo ""
            if [ "$DRY_RUN" = "true" ]; then
              echo "Dry run — nothing was committed, tagged or published."
            elif [ "$RESUMED" = "true" ]; then
              echo "⚠️ \`v${VERSION}\` is already tagged but has no GitHub Release. Finish it by re-running its [Release publish run](${PUBLISH_RUNS}), or dispatch Release publish from tag \`v${VERSION}\`."
            else
              echo "Tagged \`v${VERSION}\`. [Release publish](${PUBLISH_RUNS}) builds and publishes it — approve the \`production\` deployment there."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
