name: Develop Snapshot Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Every push to main (the next minor) publishes a snapshot. The channel and dist-tag keep the
# `develop` name from the retired develop branch so `@open-mercato/*@develop` installs keep working.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Serialize snapshot runs per branch — queue rather than cancel.
# cancel-in-progress: false is intentional: cancelling mid-publish would
# leave some packages at the new version and others at the previous one,
# making the npm registry inconsistent. Queuing is the safe behaviour.
concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    name: Publish Snapshot
    permissions:
      contents: read
      id-token: write  # required for npm provenance attestation
    outputs:
      snapshot_version: ${{ steps.release.outputs.version }}
      publish_tag: ${{ steps.channel.outputs.publish_tag }}
      packages_json: ${{ steps.release.outputs.packages_json }}
    # GitHub-hosted on purpose — do NOT move this job to a Blacksmith runner.
    # `scripts/publish-packages.sh` publishes with `npm publish --provenance`, and
    # npm's sigstore verification rejects every other runner class:
    #   422 Unprocessable Entity — Error verifying sigstore provenance bundle:
    #   Unsupported GitHub Actions runner environment: "self-hosted".
    # Blacksmith runners register as `self-hosted`, so this job published nothing
    # between #5244 and #5292. Guarded by scripts/__tests__/npm-provenance-runners.test.mjs.
    runs-on: ubuntu-latest
    env:
      YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      - name: Enable Corepack
        run: corepack enable

      - name: Configure npm authentication
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          echo "access=public" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Determine snapshot channel
        id: channel
        run: |
          CONFIG=$(node scripts/lib/snapshot-release.mjs config \
            --event-name "${{ github.event_name }}" \
            --ref-name "${{ github.ref_name }}")

          echo "channel=$(echo "$CONFIG" | jq -r '.channel')" >> $GITHUB_OUTPUT
          echo "publish_tag=$(echo "$CONFIG" | jq -r '.publishTag')" >> $GITHUB_OUTPUT
          echo "moving_install_target=$(echo "$CONFIG" | jq -r '.movingInstallTarget')" >> $GITHUB_OUTPUT
          echo "release_kind=$(echo "$CONFIG" | jq -r '.releaseKind')" >> $GITHUB_OUTPUT

      - name: Release snapshot
        id: release
        run: |
          ./scripts/release-snapshot.sh \
            --channel "${{ steps.channel.outputs.channel }}" \
            --tag "${{ steps.channel.outputs.publish_tag }}"

          # Extract published version for downstream jobs
          VERSION=$(jq -r '.version' packages/shared/package.json)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          # Build packages list for PR comment
          PACKAGES_JSON=$(find packages -name package.json -not -path "*/node_modules/*" -exec cat {} \; | \
            jq -s --arg version "$VERSION" \
              '[.[] | select(.private != true and .version == $version) | {name: .name, version: .version}]')

          echo "packages_json<<EOF" >> $GITHUB_OUTPUT
          echo "$PACKAGES_JSON" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          PACKAGE_COUNT=$(echo "$PACKAGES_JSON" | jq 'length')
          echo "package_count=$PACKAGE_COUNT" >> $GITHUB_OUTPUT

      - name: Write workflow summary
        if: steps.release.outputs.package_count != '0'
        run: |
          cat > /tmp/packages.json <<'EOF'
          ${{ steps.release.outputs.packages_json }}
          EOF

          {
            echo "## Snapshot Release"
            echo ""
            echo "- Release kind: \`${{ steps.channel.outputs.release_kind }}\`"
            echo "- Dist-tag: \`${{ steps.channel.outputs.publish_tag }}\`"
            echo "- Exact snapshot version: \`${{ steps.release.outputs.version }}\`"

            if [ -n "${{ steps.channel.outputs.moving_install_target }}" ]; then
              echo "- Moving install target: \`${{ steps.channel.outputs.moving_install_target }}\`"
            fi

            echo ""
            echo "| Package | Version |"
            echo "|---------|---------|"
            jq -r '.[] | "| `\(.name)` | `\(.version)` |"' /tmp/packages.json
            echo ""

            if [ -n "${{ steps.channel.outputs.moving_install_target }}" ]; then
              echo "### Moving Develop Channel"
              echo ""
              echo '```bash'
              echo 'yarn add @open-mercato/core@develop'
              echo 'npx create-mercato-app@develop my-app'
              echo '```'
              echo ""
            fi

            echo "### Exact Snapshot"
            echo ""
            echo '```bash'
            echo "yarn add @open-mercato/core@${{ steps.release.outputs.version }}"
            echo "npx create-mercato-app@${{ steps.release.outputs.version }} my-app"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  standalone-integration:
    name: Standalone App Integration Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: snapshot
    if: needs.snapshot.outputs.snapshot_version != ''
    services:
      postgres:
        # MUST match the pgvector-enabled image used by local dev / prod
        # (starters/docker/compose.infra.yml, starters/docker/compose.fullapp.yml) — plain `postgres:17`
        # lacks the `vector` extension, so `CREATE EXTENSION vector` fails and
        # any vector-search codepath exercised by the integration suite breaks.
        image: pgvector/pgvector:pg17-trixie
        env:
          POSTGRES_USER: mercato
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: mercato_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # --- Monorepo setup (for test infrastructure) ---
      - name: Checkout monorepo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      - name: Enable Corepack
        run: corepack enable

      - name: Install monorepo dependencies
        run: yarn install --immutable

      - name: Build monorepo packages
        run: |
          yarn build:packages
          yarn generate
          yarn build:packages

      # --- Wait for npm propagation ---
      - name: Wait for npm registry propagation
        run: |
          VERSION="${{ needs.snapshot.outputs.snapshot_version }}"
          mapfile -t PACKAGES < <(jq -r '.[].name' <<'EOF'
          ${{ needs.snapshot.outputs.packages_json }}
          EOF
          )

          # Wait for the published version's METADATA to propagate. This does NOT
          # cover npm's post-publish tarball QUARANTINE (metadata goes public
          # first while the tarball stays quarantined for a security scan) — that
          # is handled by retrying the real scaffold/install steps below via
          # scripts/ci/npm-retry-on-quarantine.sh.
          bash "$GITHUB_WORKSPACE/scripts/ci/npm-wait-for-metadata.sh" "$VERSION" "${PACKAGES[@]}"

      - name: Install Playwright
        run: yarn playwright install --with-deps chromium

      - name: Run published standalone integration suite
        env:
          STANDALONE_VERSION: ${{ needs.snapshot.outputs.snapshot_version }}
          STANDALONE_DATABASE_URL: postgres://mercato:secret@localhost:5432/mercato_test
        run: >-
          node scripts/ci/standalone-integration.mjs
          --source published
          --version "$STANDALONE_VERSION"
          --app-dir /tmp/standalone-app
          --suite full

      - name: Print standalone app log on test failure
        if: failure()
        run: |
          echo "=== /tmp/standalone-app.log (last 1000 lines) ==="
          tail -n 1000 /tmp/standalone-app.log || echo "(no log file)"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: standalone-integration-results
          path: |
            .ai/qa/test-results/html/
            .ai/qa/test-results/artifacts/
            .ai/qa/test-results/results.json
            .ai/qa/test-results/standalone-selection.json
          if-no-files-found: ignore

      - name: Upload standalone app log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: standalone-app-log
          path: /tmp/standalone-app.log
          if-no-files-found: ignore
