name: Release cut

# Splits main into a release line (CONTRIBUTING.md § Releasing): with main at X.Y.Z it creates
# `release/vX.Y.x` at main's tip, ensures the `backport release/vX.Y.x` and `backport main`
# labels, hands main's `# Unreleased` changelog section to the line, and opens the PR moving
# main to X.(Y+1).0. It publishes nothing — ship the line with the Release workflow, run from the
# new branch. Re-running is safe: an existing branch is left alone and the PR is reused.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Show the branch and version it would create, without touching GitHub'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  cut:
    name: Cut a release line from main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      # The release app (CONTRIBUTING.md § Releasing → One-time setup) creates the line under the
      # `release/v*` ruleset and opens a main PR that CI actually runs on; GITHUB_TOKEN can do neither.
      # A dry run touches no API, so it needs no app token.
      - name: Mint the release token
        if: ${{ !inputs.dry_run }}
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Cut the release line
        id: cut
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/release-line.mts cut ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Write workflow summary
        if: always() && steps.cut.outputs.releaseBranch != ''
        env:
          RELEASE_BRANCH: ${{ steps.cut.outputs.releaseBranch }}
          CURRENT: ${{ steps.cut.outputs.current }}
          NEXT: ${{ steps.cut.outputs.nextVersion }}
          PR_URL: ${{ steps.cut.outputs.prUrl }}
        run: |
          {
            echo "## ✂️ ${RELEASE_BRANCH} (${CURRENT})"
            echo ""
            echo "main moves to \`${NEXT}\`${PR_URL:+ in ${PR_URL}}."
            echo ""
            echo "Next: merge that PR, then run **Release** from \`${RELEASE_BRANCH}\`. Fixes reach the line through the \`backport ${RELEASE_BRANCH}\` label."
          } >> "$GITHUB_STEP_SUMMARY"
