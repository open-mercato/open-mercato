misconfigurations:
  - id: DS-0002
    paths: ["docker/preview/Dockerfile"]
    statement: >-
      The QA preview image (docker-compose.preview.yaml, qa-deploy.yml) mounts the
      host Docker socket for Testcontainers and installs and builds the workspace at
      container start; both need root inside this disposable, non-production
      container. The production Dockerfile and the create-app template already run
      as a non-root user.
