compressionLevel: mixed

enableTelemetry: false

nodeLinker: node-modules

npmRegistryServer: "https://registry.npmjs.org"
npmPublishRegistry: "https://registry.npmjs.org"

# Yarn's npmMinimalAgeGate (default 1d) rejects versions published less than
# the configured duration. Raised to 5 days to close the supply-chain window
# where a compromised maintainer account pushes a malicious patch before any
# advisory exists. Most known npm supply-chain attacks are detected and
# reverted within hours to a few days, so 5d covers the vast majority of
# incidents while keeping critical security fixes reachable sooner.
# For urgent patches: `yarn add pkg@version --no-time-gate` bypasses per-call.
# Our own releases get consumed minutes after publishing (module installs,
# snapshot verification), so the first-party scope opts out via
# npmPreapprovedPackages while third-party packages keep the cooldown.
npmMinimalAgeGate: 5d
npmPreapprovedPackages:
  - "@open-mercato/*"

packageExtensions:
  "cmdk@*":
    peerDependenciesMeta:
      react:
        optional: true
      react-dom:
        optional: true
      "@types/react":
        optional: true
  "ts-jest@*":
    peerDependenciesMeta:
      typescript:
        optional: true
  "@radix-ui/react-tooltip@*":
    peerDependenciesMeta:
      react:
        optional: true
      react-dom:
        optional: true
  "@testing-library/react@*":
    peerDependenciesMeta:
      react:
        optional: true
      react-dom:
        optional: true
  "react-big-calendar@*":
    peerDependenciesMeta:
      react:
        optional: true
      react-dom:
        optional: true
  "@algolia/autocomplete-shared@*":
    peerDependenciesMeta:
      "@algolia/client-search":
        optional: true
      algoliasearch:
        optional: true
  "@algolia/autocomplete-plugin-algolia-insights@*":
    peerDependenciesMeta:
      search-insights:
        optional: true
  "@docusaurus/core@*":
    peerDependenciesMeta:
      "@mdx-js/react":
        optional: true
      react:
        optional: true
      react-dom:
        optional: true
  "@docusaurus/types@*":
    peerDependenciesMeta:
      react:
        optional: true
      react-dom:
        optional: true
  "@docusaurus/mdx-loader@*":
    peerDependenciesMeta:
      react:
        optional: true
      react-dom:
        optional: true
  "@docusaurus/theme-common@*":
