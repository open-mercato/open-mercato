# Full stack with app in dev mode: mounted source + yarn dev (watch).
# Before first run: cp .env.example .env && yarn install
# Usage: docker compose -f docker-compose.fullapp.dev.yml up --build

services:
  app:
    build:
      context: .
      target: dev
      args:
        - OPEN_MERCATO_DOCKER_REGISTRY_HOST=host.docker.internal
      extra_hosts:
        - "host.docker.internal:host-gateway"
    user: "0"
    command: ["/bin/sh", "/app/docker/scripts/dev-entrypoint.sh"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
      - init_marker:/tmp/init-marker
      - attachments_storage:/app/storage
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
      REDIS_URL: redis://redis:6379
      QUEUE_REDIS_URL: redis://redis:6379
      TENANT_DATA_ENCRYPTION: ${TENANT_DATA_ENCRYPTION:-true}
      TENANT_DATA_ENCRYPTION_DEBUG: ${TENANT_DATA_ENCRYPTION_DEBUG:-false}
      TENANT_DATA_ENCRYPTION_FALLBACK_KEY: ${TENANT_DATA_ENCRYPTION_FALLBACK_KEY:-dev-tenant-encryption-fallback-key-32chars}
      NODE_ENV: development
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=3072}
      DEPLOY_ENV: ${DEPLOY_ENV:-local}
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-open-mercato}
      JWT_SECRET: ${JWT_SECRET:-JWT}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Additional trusted app/dev origins for the Open Mercato origin allowlist (resolveAllowedDevOrigins)
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-}
      NEXT_PUBLIC_DOCUMENTS_COLLAB_URL: ${NEXT_PUBLIC_DOCUMENTS_COLLAB_URL:-}
      DOCUMENTS_COLLAB_JWT_SECRET_V2: ${DOCUMENTS_COLLAB_JWT_SECRET_V2:-dev-only-documents-collab-v2-secret}
      CACHE_REDIS_URL: redis://redis:6379
      CACHE_STRATEGY: ${CACHE_STRATEGY:-redis}
      ENABLE_CRUD_API_CACHE: ${ENABLE_CRUD_API_CACHE:-true}
      OM_AI_PROVIDER: ${OM_AI_PROVIDER:-openai}
      OM_AI_MODEL: ${OM_AI_MODEL:-gpt-5-mini}
      OPENCODE_PROVIDER: ${OPENCODE_PROVIDER:-}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-meilisearch-dev-key}
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-meilisearch-dev-key}
      NEXT_PUBLIC_UPGRADE_ACTIONS_ENABLED: ${NEXT_PUBLIC_UPGRADE_ACTIONS_ENABLED:-true}
      UPGRADE_ACTIONS_ENABLED: ${UPGRADE_ACTIONS_ENABLED:-true}
      SELF_SERVICE_ONBOARDING_ENABLED: ${SELF_SERVICE_ONBOARDING_ENABLED:-true}
      DEMO_MODE: ${DEMO_MODE:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      TENANT_DATA_ENCRYPTION_KEY: ${TENANT_DATA_ENCRYPTION_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      OM_INIT_SUPERADMIN_EMAIL: ${OM_INIT_SUPERADMIN_EMAIL:-}
      OM_INIT_SUPERADMIN_PASSWORD: ${OM_INIT_SUPERADMIN_PASSWORD:-password}
      OPEN_MERCATO_DOCKER_REGISTRY_HOST: ${OPEN_MERCATO_DOCKER_REGISTRY_HOST:-host.docker.internal}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - mercato-network-fullapp

  documents-collab:
    profiles:
      - documents-collab
    build:
      context: .
      target: dev
      args:
        - OPEN_MERCATO_DOCKER_REGISTRY_HOST=host.docker.internal
      extra_hosts:
        - "host.docker.internal:host-gateway"
    command: ["yarn", "documents:collab"]
    working_dir: /app
    # Restart so a first boot that races the shared app build comes back up
    # once its dependencies are present, instead of exiting and staying dead.
    restart: unless-stopped
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    ports:
      - "${DOCUMENTS_COLLAB_PORT:-4101}:${DOCUMENTS_COLLAB_PORT:-4101}"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-open-mercato}
      JWT_SECRET: ${JWT_SECRET:-JWT}
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
      DOCUMENTS_COLLAB_PORT: ${DOCUMENTS_COLLAB_PORT:-4101}
      DOCUMENTS_COLLAB_REDIS_URL: redis://redis:6379
      DOCUMENTS_COLLAB_REDIS_PREFIX: ${DOCUMENTS_COLLAB_REDIS_PREFIX:-open-mercato:documents:collab:${DEPLOY_ENV:-local}}
      # Same Redis as the app so multi-instance collaboration sync works out of the box
      # (DOCUMENTS_COLLAB_REDIS_URL wins when both are set).
      REDIS_URL: redis://redis:6379
      DOCUMENTS_COLLAB_ALLOWED_ORIGINS: ${DOCUMENTS_COLLAB_ALLOWED_ORIGINS:-http://localhost:3000}
      DOCUMENTS_COLLAB_JWT_SECRET_V2: ${DOCUMENTS_COLLAB_JWT_SECRET_V2:-dev-only-documents-collab-v2-secret}
      DOCUMENTS_COLLAB_JWT_SECRET: ${DOCUMENTS_COLLAB_JWT_SECRET:-}
      DOCUMENTS_COLLAB_APP_ROOT: /app
      # Mirror the app service's tenant-encryption configuration so the sidecar
      # can decrypt the same data as the app.
      TENANT_DATA_ENCRYPTION: ${TENANT_DATA_ENCRYPTION:-true}
      TENANT_DATA_ENCRYPTION_DEBUG: ${TENANT_DATA_ENCRYPTION_DEBUG:-false}
      TENANT_DATA_ENCRYPTION_FALLBACK_KEY: ${TENANT_DATA_ENCRYPTION_FALLBACK_KEY:-dev-tenant-encryption-fallback-key-32chars}
      TENANT_DATA_ENCRYPTION_KEY: ${TENANT_DATA_ENCRYPTION_KEY:-}
      CACHE_REDIS_URL: redis://redis:6379
      CACHE_STRATEGY: ${CACHE_STRATEGY:-redis}
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mercato-network-fullapp

  # --- Agent Orchestrator: file-defined (OpenCode) agents -------------------
  # Opt-in: both services only start with `--profile agents`, because the pair
  # roughly doubles the stack's RAM footprint and is useless unless
  # OM_ENABLE_ENTERPRISE_MODULES_AGENTS=true.
  #
  #   docker compose --profile agents -f docker-compose.fullapp.dev.yml up
  #
  # `yarn generate` writes the agent + skill files this service mounts, so run
  # it (the app container does on boot) before starting opencode, and restart
  # opencode after regenerating — it reads them once at startup.
  opencode:
    profiles:
      - agents
    # No local build: OpenCode is pre-installed in the published base image and
    # everything else is bind-mounted, so a scaffolded app needs no Docker build
    # for the agent runtime. To bake a production image instead, swap this for
    # `build: { context: ./docker/opencode }` (see docker/opencode/Dockerfile).
    image: ${OPENCODE_BASE_IMAGE:-docker.io/openmercatocom/open-mercato-opencode:1.18.3}
    # Invoked through `sh` so the mount does not depend on a preserved exec bit.
    entrypoint: ["/bin/sh", "/home/opencode/entrypoint.sh"]
    restart: unless-stopped
    # Published for local development (MCP Inspector, curl /global/health).
    # OpenCode has no authentication of its own, so do not expose this port on
    # a shared or public host without setting OPENCODE_PASSWORD.
    ports:
      - "${OPENCODE_PORT:-4096}:4096"
    environment:
      OM_AI_PROVIDER: ${OM_AI_PROVIDER:-openai}
      OM_AI_MODEL: ${OM_AI_MODEL:-gpt-5-mini}
      OPENCODE_PROVIDER: ${OPENCODE_PROVIDER:-}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-}
      OPENCODE_PASSWORD: ${OPENCODE_PASSWORD:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      # In-network MCP wiring. MCP_SERVER_API_KEY (env) wins when set; the file
      # fallback reads the key the mcp service provisioned into the shared
      # volume after waiting for the MCP /health endpoint.
      OPENCODE_MCP_URL: ${OPENCODE_MCP_URL:-http://mcp:3001/mcp}
      MCP_SERVER_API_KEY: ${MCP_SERVER_API_KEY:-}
      MCP_SERVER_API_KEY_FILE: /run/mcp-shared/mcp-api-key
      OM_OPENCODE_FILES_ENABLED: ${OM_OPENCODE_FILES_ENABLED:-false}
    volumes:
      - mcp_shared:/run/mcp-shared:ro
      - ./docker/opencode/entrypoint.sh:/home/opencode/entrypoint.sh:ro
      - ./docker/opencode/AGENTS.md:/home/opencode/AGENTS.md:ro
      # Generator output (`yarn generate`). Restart this service after changing
      # any agents/<id>/ source file.
      - ./docker/opencode/agents:/home/opencode/.config/opencode/agents:ro
      - ./docker/opencode/skills:/home/opencode/.config/opencode/skills:ro
      # Corporate CA bundle; the entrypoint exports SSL_CERT_FILE /
      # NODE_EXTRA_CA_CERTS when certificates are present.
      - ./docker/opencode/certs:/run/om-certs:ro
    depends_on:
      mcp:
        condition: service_started
    # Visibility only (compose ps / smoke tests): the entrypoint owns the
    # wait-for-MCP-and-key sequencing.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:4096/global/health"]
      interval: 30s
      timeout: 6s
      retries: 20
      start_period: 900s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mercato-network-fullapp

  # The MCP tool plane the OpenCode agents call back into. Same image as `app`,
  # different entrypoint. It waits for the app over HTTP, provisions its own API
  # key into the shared volume, then serves Streamable HTTP MCP on :3001.
  mcp:
    profiles:
      - agents
    build:
      context: .
      target: dev
      args:
        - OPEN_MERCATO_DOCKER_REGISTRY_HOST=host.docker.internal
      extra_hosts:
        - "host.docker.internal:host-gateway"
    restart: unless-stopped
    user: "0"
    command:
      - /bin/sh
      - -lc
      - |
        if [ ! -f /app/docker/scripts/mcp-entrypoint.sh ]; then
          echo "ERROR: mcp-entrypoint.sh not found. Please rebuild: docker compose build --no-cache mcp"
          exit 1
        fi
        sh /app/docker/scripts/mcp-entrypoint.sh
    working_dir: /app
    ports:
      - "${MCP_PORT:-3001}:3001"
    volumes:
      # KEEP IN SYNC with the `app` service: the sidecar runs the same source.
      - .:/app
      - app_node_modules:/app/node_modules
      - mcp_shared:/run/mcp-shared
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NODE_OPTIONS: ${MCP_NODE_OPTIONS:---max-old-space-size=2048}
      DEPLOY_ENV: ${DEPLOY_ENV:-local}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-open-mercato}
      CACHE_REDIS_URL: redis://redis:6379
      CACHE_STRATEGY: ${CACHE_STRATEGY:-redis}
      # The sidecar must never drain the queues the app workers own.
      AUTO_SPAWN_WORKERS: "false"
      AUTO_SPAWN_SCHEDULER: "false"
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_MASTER_KEY:-meilisearch-dev-key}
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in the .env file next to this compose file - generate one with: openssl rand -hex 32}"
      JWT_LEGACY_GRACE_MINUTES: "${JWT_LEGACY_GRACE_MINUTES:-480}"
      JWT_LEGACY_CUTOVER_AT: "${JWT_LEGACY_CUTOVER_AT:-}"
      # Code Mode api.request() must call back into the app over service DNS.
      # NEXT_PUBLIC_* are pinned so a stray .env cannot hijack the base URL.
      APP_URL: http://app:${CONTAINER_PORT:-3000}
      NEXT_PUBLIC_APP_URL: http://app:${CONTAINER_PORT:-3000}
      NEXT_PUBLIC_API_BASE_URL: ""
      # Session-token (tier 2) decryption requires the app's encryption config.
      TENANT_DATA_ENCRYPTION: ${TENANT_DATA_ENCRYPTION:-true}
      TENANT_DATA_ENCRYPTION_DEBUG: ${TENANT_DATA_ENCRYPTION_DEBUG:-false}
      TENANT_DATA_ENCRYPTION_FALLBACK_KEY: ${TENANT_DATA_ENCRYPTION_FALLBACK_KEY:-dev-tenant-encryption-fallback-key-32chars}
      TENANT_DATA_ENCRYPTION_KEY: ${TENANT_DATA_ENCRYPTION_KEY:-}
      OM_INIT_SUPERADMIN_EMAIL: ${OM_INIT_SUPERADMIN_EMAIL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      MCP_PORT: "3001"
      MCP_SERVER_API_KEY_FILE: /run/mcp-shared/mcp-api-key
      MCP_WAIT_FOR_APP_TIMEOUT: ${MCP_WAIT_FOR_APP_TIMEOUT:-1800}
      MCP_DEBUG: ${MCP_DEBUG:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 900s
    networks:
      - mercato-network-fullapp

  postgres:
    image: pgvector/pgvector:pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-open-mercato}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mercato-network-fullapp

  redis:
    image: redis:7-alpine
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data
    command: redis-server /usr/local/etc/redis/redis.conf --maxmemory ${REDIS_MAXMEMORY:-512mb}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mercato-network-fullapp

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-meilisearch-dev-key}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mercato-network-fullapp

  localstack:
    image: localstack/localstack:latest
    restart: unless-stopped
    profiles:
      - storage-s3
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      LOCALSTACK_HOST: localhost
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mercato-network-fullapp

volumes:
  postgres_data:
  # Shared MCP API key file: the mcp service provisions it, opencode reads it.
  mcp_shared:
  redis_data:
  meilisearch_data:
  localstack_data:
  init_marker:
  attachments_storage:
  app_node_modules:
  app_next:

networks:
  mercato-network-fullapp:
    driver: bridge
