# Generated by the Open Mercato om-setup-ci skill. Documentation: docs/ci/README.md
#
# Pull requests are gated only on what they INTRODUCE. This nightly workflow
# scans `__OM_DEFAULT_BRANCH__` in full, so a secret buried in old history, a finding
# from a newly published rule or a fresh CVE in the base image is still found.
# While any scan fails it keeps one tracking issue open; the first clean run
# closes it.
name: Scheduled Security Scan

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  schedule:
    - cron: '__OM_SECURITY_CRON__'
  workflow_dispatch:

concurrency:
  group: scheduled-security-scan
  cancel-in-progress: false

jobs:
#@if secrets
  secrets:
    name: Secret scan (full history)
    runs-on: __OM_RUNNER__
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: __OM_ACTION_CHECKOUT__
        with:
          ref: __OM_DEFAULT_BRANCH__
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        uses: ./.github/actions/gitleaks

      - name: Scan the full history for secrets
        run: '"$RUNNER_TEMP/gitleaks-bin/gitleaks" git --no-banner --redact --verbose .'

#@endif
#@if sast
  sast:
    name: Static analysis (full)
    runs-on: __OM_RUNNER__
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: __OM_ACTION_CHECKOUT__
        with:
          ref: __OM_DEFAULT_BRANCH__
          persist-credentials: false

      - name: Run Semgrep with the Open Mercato rules
        shell: bash
        env:
          SEMGREP_IMAGE: __OM_SEMGREP_IMAGE__
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --metrics=off --error \
            --config scripts/ci/semgrep/open-mercato.yml \
            --exclude '**/__tests__/**' --exclude '**/__integration__/**' \
            --exclude '*.test.*' --exclude '*.spec.*' \
            src

#@endif
#@if imageScan
  image:
    name: Image scan (OS and npm packages)
    runs-on: __OM_RUNNER__
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: __OM_ACTION_CHECKOUT__
        with:
          ref: __OM_DEFAULT_BRANCH__
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: __OM_ACTION_SETUP_BUILDX__

      - name: Build production image
        uses: __OM_ACTION_BUILD_PUSH__
        with:
          context: .
          file: __OM_DOCKERFILE__
          push: false
          load: true
          tags: app:nightly

      # The base image's own global npm toolchain (/usr/local/lib/node_modules)
      # is skipped: it is not shipped by the app, only a newer Node base image
      # can fix it, and it would keep this scan red for reasons outside the
      # app's control. The app's node_modules inside the image are scanned.
      - name: Scan image with Trivy
        shell: bash
        env:
          TRIVY_IMAGE: __OM_TRIVY_IMAGE__
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" -w /work "$TRIVY_IMAGE" \
            image --no-progress --skip-version-check --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            --skip-dirs /usr/local/lib/node_modules app:nightly

#@endif
#@if dast
  # Passive OWASP ZAP baseline scan of the running app: security headers,
  # cookie flags, information leaks and error disclosure. The app is booted
  # exactly like the integration tests (ephemeral PostgreSQL), unauthenticated.
  # Which alerts fail the job is set in scripts/ci/zap-rules.tsv.
  dast:
    name: Dynamic scan (OWASP ZAP)
    runs-on: __OM_RUNNER__
    timeout-minutes: 60
    env:
      OM_INTEGRATION_APP_READY_TIMEOUT_SECONDS: '180'
    steps:
      - name: Checkout repository
        uses: __OM_ACTION_CHECKOUT__
        with:
          ref: __OM_DEFAULT_BRANCH__
          persist-credentials: false

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup

      - name: Start the app on an ephemeral database
        id: app
        shell: bash
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/ephemeral-app.log"
          STATE=.ai/qa/ephemeral-env.json
          nohup yarn test:integration:ephemeral:start > "$LOG" 2>&1 &
          for _ in $(seq 1 180); do
            if [ -f "$STATE" ] && node -e "process.exit(require('./$STATE').status === 'running' ? 0 : 1)"; then
              BASE_URL=$(node -p "require('./$STATE').baseUrl")
              if curl -fsS -o /dev/null "$BASE_URL"; then
                echo "App is up at $BASE_URL"
                echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::The app did not become ready within 15 minutes."
          tail -n 200 "$LOG"
          exit 1

      - name: Run the ZAP baseline scan
        shell: bash
        env:
          BASE_URL: ${{ steps.app.outputs.base_url }}
          ZAP_IMAGE: __OM_ZAP_IMAGE__
        run: |
          mkdir -p zap-report
          cp scripts/ci/zap-rules.tsv zap-report/zap-rules.tsv
          chmod -R a+rwX zap-report
          docker run --rm --network host -v "$PWD/zap-report:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t "$BASE_URL" -c zap-rules.tsv -m 5 -I \
            -r report.html -J report.json

      - name: Upload the ZAP report
        if: always()
        uses: __OM_ACTION_UPLOAD_ARTIFACT__
        with:
          name: zap-report
          path: zap-report
          if-no-files-found: ignore
          retention-days: 14

#@endif
  report:
    name: Tracking issue
    if: always()
    needs: [__OM_SECURITY_NEEDS__]
    runs-on: __OM_RUNNER__
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open, refresh or close the tracking issue
        uses: __OM_ACTION_GITHUB_SCRIPT__
        env:
          NEEDS: ${{ toJSON(needs) }}
          BRANCH: __OM_DEFAULT_BRANCH__
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS)
            const branch = process.env.BRANCH
            const marker = `<!-- scheduled-security-scan:${branch} -->`
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const failed = Object.keys(needs).filter((name) => ['failure', 'cancelled'].includes(needs[name].result))

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              labels: 'security',
              per_page: 100,
            })
            const existing = openIssues.find((issue) => !issue.pull_request && (issue.body ?? '').includes(marker))

            if (failed.length === 0) {
              if (!existing) return
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body: `Every scheduled security scan passes again on \`${branch}\`. Closed from ${runUrl}.`,
              })
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'closed', state_reason: 'completed' })
              return
            }

            const summary = Object.entries(needs).map(([name, job]) => `- \`${name}\`: ${job.result}`).join('\n')
            const body = [
              marker,
              `The scheduled security scan is failing on \`${branch}\`.`,
              '',
              'Opened and refreshed automatically by `.github/workflows/security.yml`; it closes itself on the first run where every scan passes.',
              'Open the run for the findings, and see `docs/ci/README.md` → *When a check fails* for how to resolve each scan.',
              '',
              `- Last checked: ${runUrl}`,
              '',
              '<!-- jobs:start -->',
              summary,
              '<!-- jobs:end -->',
            ].join('\n')

            if (!existing) {
              const created = await github.rest.issues.create({
                ...context.repo,
                title: `security: scheduled security scan failing on \`${branch}\``,
                body,
                labels: ['security'],
              })
              core.notice(`Opened tracking issue #${created.data.number}.`)
            } else {
              const jobsOf = (text) => /<!-- jobs:start -->([\s\S]*?)<!-- jobs:end -->/.exec(text ?? '')?.[1].trim() ?? null
              const changed = jobsOf(existing.body) !== jobsOf(body)
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body })
              if (changed) {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: existing.number,
                  body: `The set of failing scans changed. Refreshed from ${runUrl}.`,
                })
              }
              core.notice(`Refreshed tracking issue #${existing.number}.`)
            }
            core.setFailed(`Failing scans: ${failed.join(', ')}`)
