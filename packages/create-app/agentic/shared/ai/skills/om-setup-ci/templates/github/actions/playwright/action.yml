# Generated by the Open Mercato om-setup-ci skill. Documentation: docs/ci/README.md
#
# Installs the Chromium build that matches the app's @playwright/test version,
# caching the browser between runs. Run the setup action before this one.
name: Install Playwright browser
description: Install (and cache) the Chromium version the app's Playwright expects.

runs:
  using: composite
  steps:
    - name: Resolve Playwright version
      id: playwright
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: __OM_ACTION_CACHE__
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

    - name: Install Playwright browser
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps chromium

    - name: Install Playwright system dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install-deps chromium
