# Generated by the Open Mercato om-setup-ci skill. Documentation: docs/ci/README.md
#
# GitHub CodeQL: dataflow-aware SAST for the app's TypeScript and for the
# workflows themselves. Results appear under Security → Code scanning.
# Requires a public repository or GitHub Code Security on a private one.
# Disable GitHub's "default setup" for CodeQL when using this workflow.
name: CodeQL

on:
  push:
    branches:
__OM_BRANCH_LIST__
  pull_request:
    branches:
__OM_BRANCH_LIST__
  schedule:
    - cron: '__OM_CODEQL_CRON__'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: __OM_RUNNER__
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: Checkout repository
        uses: __OM_ACTION_CHECKOUT__
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: __OM_ACTION_CODEQL_INIT__
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - .ai
              - .mercato
              - node_modules
              - '**/__tests__'
              - '**/__integration__'

      - name: Analyze
        uses: __OM_ACTION_CODEQL_ANALYZE__
        with:
          category: /language:${{ matrix.language }}
