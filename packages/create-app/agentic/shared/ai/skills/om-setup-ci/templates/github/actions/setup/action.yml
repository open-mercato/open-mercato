# Generated by the Open Mercato om-setup-ci skill. Documentation: docs/ci/README.md
#
# One install path for every CI job, so a lockfile, Node or cache fix lands in
# exactly one place. Run actions/checkout before using this action.
name: Setup Node and dependencies
description: Install the pinned Node.js and Yarn, restore caches, and install dependencies from the lockfile.

runs:
  using: composite
  steps:
    - name: Setup Node.js
      id: node
      uses: __OM_ACTION_SETUP_NODE__
      with:
#@if nodeVersionFile
        node-version-file: __OM_NODE_VERSION_FILE__
#@endif
#@if !nodeVersionFile
        node-version: '__OM_NODE_VERSION__'
#@endif

    # Corepack provisions the exact Yarn release pinned in package.json#packageManager.
    # It must run before any `yarn` call; actions/setup-node's built-in Yarn cache
    # would invoke a global Yarn first, so the caches below are managed by hand.
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Resolve Yarn cache folder
      id: yarn-cache
      shell: bash
      run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

    - name: Cache Yarn packages
      uses: __OM_ACTION_CACHE__
      with:
        path: ${{ steps.yarn-cache.outputs.dir }}
        key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
        restore-keys: yarn-${{ runner.os }}-

    # node_modules is keyed on the exact lockfile and Node version, so a hit is
    # byte-for-byte what `yarn install --immutable` would produce.
    - name: Cache node_modules
      id: node-modules
      uses: __OM_ACTION_CACHE__
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('yarn.lock', 'package.json') }}

    # `--immutable` fails when package.json and yarn.lock disagree, so a
    # dependency change that was never installed locally cannot reach main.
    - name: Install dependencies
      if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: yarn install --immutable
