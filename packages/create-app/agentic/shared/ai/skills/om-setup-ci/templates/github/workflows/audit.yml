# Generated by the Open Mercato om-setup-ci skill. Documentation: docs/ci/README.md
#
# The pull-request audit in ci.yml blocks only advisories a change introduces.
# This nightly job audits every protected branch WITHOUT a baseline, so an
# advisory published after a dependency was merged is still caught. It keeps
# one tracking issue per branch open while advisories exist and closes it on
# the first clean run.
name: Scheduled Dependency Audit

permissions:
  contents: read

env:
  FORCE_COLOR: '0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  schedule:
    - cron: '__OM_AUDIT_CRON__'
  workflow_dispatch:

concurrency:
  group: scheduled-dependency-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit ${{ matrix.branch }}
    runs-on: __OM_RUNNER__
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        branch: [__OM_BRANCH_MATRIX__]
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: __OM_ACTION_CHECKOUT__
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false

      - name: Setup Node.js
        uses: __OM_ACTION_SETUP_NODE__
        with:
#@if nodeVersionFile
          node-version-file: __OM_NODE_VERSION_FILE__
#@endif
#@if !nodeVersionFile
          node-version: '__OM_NODE_VERSION__'
#@endif

      - name: Audit dependencies for known CVEs
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/ci/audit-ci.mjs --severity __OM_AUDIT_SEVERITY__ 2>&1 | tee audit.log

      - name: Publish job summary
        if: always()
        shell: bash
        env:
          BRANCH: ${{ matrix.branch }}
          OUTCOME: ${{ steps.audit.outcome }}
        run: |
          {
            echo "### Dependency audit (\`__OM_AUDIT_SEVERITY__\`+) — \`$BRANCH\`"
            echo
            if [ "$OUTCOME" = "success" ]; then
              echo "No advisories at severity \`__OM_AUDIT_SEVERITY__\` or above."
            else
              echo '```text'
              cat audit.log 2>/dev/null || echo "(no audit output captured)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or refresh tracking issue
        if: steps.audit.outcome == 'failure'
        uses: __OM_ACTION_GITHUB_SCRIPT__
        env:
          BRANCH: ${{ matrix.branch }}
        with:
          script: |
            const fs = require('fs')
            const branch = process.env.BRANCH
            const marker = `<!-- scheduled-dependency-audit:${branch} -->`
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`

            let report = ''
            try {
              report = fs.readFileSync('audit.log', 'utf8')
            } catch {
              report = '(no audit output captured)'
            }
            report = report.replace(/\u001b\[[0-9;]*m/g, '').trim()
            const maxReportLength = 40000
            if (report.length > maxReportLength) {
              report = `${report.slice(0, maxReportLength)}\n… truncated, see the workflow run for the full report …`
            }

            const reportBlock = ['<!-- report:start -->', '```text', report, '```', '<!-- report:end -->'].join('\n')
            const body = [
              marker,
              `The scheduled dependency audit is failing on \`${branch}\`.`,
              '',
              'Opened and refreshed automatically by `.github/workflows/audit.yml`; it closes itself on the first run where the audit passes again.',
              'Resolve it by upgrading the affected dependencies, or — only when no patched release exists — by adding a justified entry to `scripts/ci/audit-ci-allowlist.json`. See `docs/ci/README.md`.',
              '',
              `- Branch: \`${branch}\``,
              `- Last checked: ${runUrl}`,
              '',
              reportBlock,
            ].join('\n')

            const extractReport = (text) => {
              const match = /<!-- report:start -->([\s\S]*?)<!-- report:end -->/.exec(text ?? '')
              return match ? match[1].trim() : null
            }

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              labels: 'security,dependencies',
              per_page: 100,
            })
            const existing = openIssues.find((issue) => !issue.pull_request && (issue.body ?? '').includes(marker))

            if (!existing) {
              const created = await github.rest.issues.create({
                ...context.repo,
                title: `security: dependency advisories on \`${branch}\``,
                body,
                labels: ['security', 'dependencies'],
              })
              core.notice(`Opened tracking issue #${created.data.number} for ${branch}.`)
              return
            }

            const advisoriesChanged = extractReport(existing.body) !== extractReport(body)
            await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body })
            if (advisoriesChanged) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body: `The advisory set on \`${branch}\` changed. Refreshed from ${runUrl}.`,
              })
            }
            core.notice(`Refreshed tracking issue #${existing.number} for ${branch}.`)

      - name: Close tracking issue
        if: steps.audit.outcome == 'success'
        uses: __OM_ACTION_GITHUB_SCRIPT__
        env:
          BRANCH: ${{ matrix.branch }}
        with:
          script: |
            const branch = process.env.BRANCH
            const marker = `<!-- scheduled-dependency-audit:${branch} -->`
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              labels: 'security,dependencies',
              per_page: 100,
            })
            const existing = openIssues.find((issue) => !issue.pull_request && (issue.body ?? '').includes(marker))
            if (!existing) return

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: existing.number,
              body: `The dependency audit passes again on \`${branch}\`. Closed from ${runUrl}.`,
            })
            await github.rest.issues.update({
              ...context.repo,
              issue_number: existing.number,
              state: 'closed',
              state_reason: 'completed',
            })

      - name: Fail the job when advisories were found
        if: steps.audit.outcome == 'failure'
        env:
          BRANCH: ${{ matrix.branch }}
        run: |
          echo "::error::The dependency audit reported non-allowlisted advisories at severity __OM_AUDIT_SEVERITY__ or above on $BRANCH."
          exit 1
