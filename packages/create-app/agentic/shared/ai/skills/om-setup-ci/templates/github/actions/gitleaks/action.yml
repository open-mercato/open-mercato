# Generated by the Open Mercato om-setup-ci skill. Documentation: docs/ci/README.md
#
# Installs a pinned Gitleaks release to "$RUNNER_TEMP/gitleaks-bin/gitleaks"
# and refuses to unpack it unless the archive matches the published SHA-256, so
# a tampered download can never execute. PATH is deliberately left untouched.
# Gitleaks reads .gitleaks.toml and .gitleaksignore from the repository root.
name: Install Gitleaks
description: Download a pinned, checksum-verified Gitleaks binary to $RUNNER_TEMP/gitleaks-bin/gitleaks.

runs:
  using: composite
  steps:
    - name: Download and verify Gitleaks
      shell: bash
      env:
        GITLEAKS_VERSION: '__OM_GITLEAKS_VERSION__'
        GITLEAKS_SHA256: '__OM_GITLEAKS_SHA256__'
      run: |
        set -euo pipefail
        INSTALL_DIR="$RUNNER_TEMP/gitleaks-bin"
        ARCHIVE="$RUNNER_TEMP/gitleaks.tar.gz"
        mkdir -p "$INSTALL_DIR"
        curl -fsSL -o "$ARCHIVE" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        echo "${GITLEAKS_SHA256}  ${ARCHIVE}" | sha256sum --check --strict
        tar -xzf "$ARCHIVE" -C "$INSTALL_DIR" gitleaks
