# Generated by the Open Mercato om-setup-ci skill. Documentation: docs/ci/README.md
#
# Open Mercato security rules for Semgrep Community Edition. The public
# registry rulesets barely cover Next.js route handlers and server actions,
# so these rules target the patterns that matter in an Open Mercato app.
# Silence a reviewed false positive with a trailing `// nosemgrep: <rule-id>`
# comment that explains why the line is safe.
rules:
  - id: om-dynamic-code-execution
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Code built at runtime is executed. Anything an attacker can influence
      becomes remote code execution. Use a lookup table or a parser instead.
    metadata:
      cwe: 'CWE-95: Eval Injection'
      category: security
    patterns:
      - pattern-either:
          - pattern: eval($CODE)
          - pattern: new Function(..., $CODE)
          - pattern: Function(..., $CODE)
          - pattern: vm.runInNewContext($CODE, ...)
          - pattern: vm.runInThisContext($CODE, ...)
      - pattern-not: eval("...")
      - pattern-not: new Function(..., "...")
      - pattern-not: Function(..., "...")

  - id: om-dynamic-shell-command
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      A shell command is assembled from a variable. Use execFile/spawn with an
      argument array (no shell) so input can never be parsed as shell syntax.
    metadata:
      cwe: "CWE-78: OS Command Injection"
      category: security
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import { ..., exec, ... } from "$MODULE"
                  ...
              - pattern-inside: |
                  import { ..., execSync, ... } from "$MODULE"
                  ...
          - metavariable-regex:
              metavariable: $MODULE
              regex: '^(node:)?child_process$'
          - pattern-either:
              - pattern: exec($CMD, ...)
              - pattern: execSync($CMD, ...)
          - metavariable-regex:
              metavariable: $CMD
              regex: '^(?!([''"])[^''"]*\1$|`[^`$]*`$)'
      - patterns:
          - pattern-either:
              - pattern: $CP.exec($CMD, ...)
              - pattern: $CP.execSync($CMD, ...)
          - metavariable-regex:
              metavariable: $CP
              regex: '^(cp|childProcess|child_process|childProcesses)$'
          - metavariable-regex:
              metavariable: $CMD
              regex: '^(?!([''"])[^''"]*\1$|`[^`$]*`$)'
      - pattern: '$CP.$FN(..., {..., shell: true, ...})'
      - pattern: '$FN(..., {..., shell: true, ...})'

  - id: om-raw-sql-interpolation
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      A raw SQL string is built with interpolation. Use the query builder or
      bound parameters (Kysely `sql` tagged template, MikroORM `em.execute(sql,
      params)`) so values are never spliced into SQL text.
    metadata:
      cwe: "CWE-89: SQL Injection"
      category: security
    patterns:
      - pattern-either:
          - pattern: sql.raw(`...${$X}...`)
          - pattern: $DB.raw(`...${$X}...`, ...)
          - pattern: $DB.execute(`...${$X}...`, ...)
          - pattern: $DB.query(`...${$X}...`, ...)
          - pattern: sql.raw("..." + $X)
          - pattern: $DB.raw("..." + $X, ...)
          - pattern: $DB.execute("..." + $X, ...)
          - pattern: $DB.query("..." + $X, ...)
      # Safe idioms for dynamic SQL are not flagged: a constant (a table name),
      # a generated list of `?` placeholders, and a parameterized fragment from
      # a clause builder that returns `{ sql, params }` (`${clause.sql}`).
      - metavariable-regex:
          metavariable: $X
          regex: '^(?![A-Z][A-Z0-9_]*$)(?!.*[Pp]laceholders?$)(?!.*\.sql$)(?!.*(Clause|clause|Fragment|fragment)$)'

  - id: om-dangerously-set-inner-html
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      HTML from a variable is injected into the page. Render it as text, or
      sanitize it first (for example with DOMPurify) and mark the reviewed
      line with `// nosemgrep: om-dangerously-set-inner-html`.
    metadata:
      cwe: "CWE-79: Cross-site Scripting"
      category: security
    patterns:
      - pattern: '<$EL dangerouslySetInnerHTML={{__html: $HTML}} />'
      - pattern-not: '<$EL dangerouslySetInnerHTML={{__html: "..."}} />'
      - metavariable-regex:
          metavariable: $HTML
          regex: '^(?![A-Z][A-Z0-9_]*$)'

  - id: om-open-redirect
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      The redirect target comes straight from the request. Redirect only to a
      relative path you validated, or to an allowlisted host.
    metadata:
      cwe: "CWE-601: Open Redirect"
      category: security
    patterns:
      - pattern-either:
          - pattern: redirect($TARGET, ...)
          - pattern: NextResponse.redirect($TARGET, ...)
          - pattern: Response.redirect($TARGET, ...)
      - metavariable-pattern:
          metavariable: $TARGET
          pattern-either:
            - pattern: $SOURCE.searchParams.get(...)
            - pattern: $SOURCE.nextUrl.searchParams.get(...)
            - pattern: $HEADERS.get("referer")
            - pattern: $SEARCH_PARAMS.get(...)

  - id: om-cookie-without-httponly
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      A cookie is set with `httpOnly: false`, so page scripts (and any XSS) can
      read it. Keep session and auth cookies httpOnly.
    metadata:
      cwe: "CWE-1004: Sensitive Cookie Without 'HttpOnly' Flag"
      category: security
    pattern-either:
      - pattern: '$COOKIES.set($NAME, $VALUE, {..., httpOnly: false, ...})'
      - pattern: '$COOKIES.set({..., httpOnly: false, ...})'
