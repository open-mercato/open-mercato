# Generated by the Open Mercato om-setup-ci skill. Documentation: docs/ci/README.md
#
# Keeps the GitHub Actions used by .github/workflows on supported major
# versions. npm dependencies are deliberately not version-bumped here:
# @open-mercato/* packages move in lockstep and are upgraded with the
# om-auto-upgrade-* skills, and security fixes for third-party packages arrive
# through Dependabot security updates (Settings → Code security).
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci
