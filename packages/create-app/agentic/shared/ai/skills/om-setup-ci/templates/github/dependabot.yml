# Generated by the Open Mercato om-setup-ci skill. Documentation: docs/ci/README.md
#
# Keeps the GitHub Actions used by .github/workflows current. Actions are
# pinned to commit SHAs; Dependabot moves the SHA and its `# vX.Y.Z` comment
# together. The cooldown waits 14 days after a release before proposing it,
# so a compromised release is usually caught upstream before it reaches you.
#
# npm dependencies are deliberately not version-bumped here: @open-mercato/*
# packages move in lockstep and are upgraded with the om-auto-upgrade-* skills,
# and security fixes for third-party packages arrive through Dependabot
# security updates (Settings → Code security).
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci
