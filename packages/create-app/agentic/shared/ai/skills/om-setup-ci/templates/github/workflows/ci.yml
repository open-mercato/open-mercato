# Generated by the Open Mercato om-setup-ci skill. Documentation: docs/ci/README.md
# Regenerate with: node .ai/skills/om-setup-ci/scripts/setup-ci.mjs --force
#
# Branch protection: require the single `CI` check. It aggregates every job
# below, so adding or removing a job never needs a branch-protection change.
name: CI

on:
  push:
    branches:
__OM_BRANCH_LIST__
  pull_request:
    branches:
__OM_BRANCH_LIST__
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its previous run. Pushes to protected
# branches always run to completion so every merged commit has a verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # ── Change detection ────────────────────────────────────────────────────────
  # Decides which conditional jobs run. A pull request is compared with its
  # base (HEAD^1 of the merge commit); a push with the previous tip.
  changes:
    name: Detect changes
    runs-on: __OM_RUNNER__
    timeout-minutes: 5
    outputs:
      dependencies: ${{ steps.diff.outputs.dependencies }}
      docker: ${{ steps.diff.outputs.docker }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Classify changed files
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only HEAD^1 HEAD)
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [[ "$BEFORE" =~ ^0+$ ]]; then
              CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD)
            else
              git fetch --no-tags --depth=1 origin "$BEFORE" || true
              if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                CHANGED=$(git diff --name-only "$BEFORE" HEAD)
              else
                CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD)
              fi
            fi
          fi
          printf 'Changed files:\n%s\n' "$CHANGED"

          classify() {
            if printf '%s\n' "$CHANGED" | grep -Eq "$2"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          classify dependencies '(^|/)(package\.json|yarn\.lock|\.yarnrc\.yml)$|^scripts/ci/audit-ci'
          classify docker '^(Dockerfile|\.dockerignore|docker/|package\.json$|yarn\.lock$|\.yarnrc\.yml$|next\.config\.)'

  # ── Dependency audit ────────────────────────────────────────────────────────
  # Runs only when dependencies change, and fails only on advisories the change
  # INTRODUCES (compared with the base lockfile). Advisories already present on
  # the base branch are owned by the nightly .github/workflows/audit.yml, which
  # keeps a tracking issue open until they are fixed.
  audit:
    name: Dependency audit
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: __OM_RUNNER__
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
#@if nodeVersionFile
          node-version-file: __OM_NODE_VERSION_FILE__
#@endif
#@if !nodeVersionFile
          node-version: '__OM_NODE_VERSION__'
#@endif

      - name: Resolve audit baseline lockfile
        id: audit-baseline
        shell: bash
        run: |
          set -uo pipefail
          BASELINE="$RUNNER_TEMP/baseline-yarn.lock"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="HEAD^1"
          else
            BASE_REF="${{ github.event.before }}"
            if [ -n "$BASE_REF" ] && ! [[ "$BASE_REF" =~ ^0+$ ]]; then
              git fetch --no-tags --depth=1 origin "$BASE_REF" || true
            else
              BASE_REF=""
            fi
          fi
          if [ -n "$BASE_REF" ] && git show "$BASE_REF:yarn.lock" > "$BASELINE" 2>/dev/null; then
            echo "args=--baseline $BASELINE" >> "$GITHUB_OUTPUT"
            echo "Auditing against the baseline yarn.lock from $BASE_REF."
          else
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "::notice::No baseline yarn.lock available — auditing strictly."
          fi

      # The audit reads yarn.lock and queries the npm advisory database directly,
      # so it needs no `yarn install`. It fails closed when advisory data cannot
      # be fetched. Justified exceptions live in scripts/ci/audit-ci-allowlist.json.
      - name: Audit dependencies for known CVEs
        run: node scripts/ci/audit-ci.mjs --severity __OM_AUDIT_SEVERITY__ ${{ steps.audit-baseline.outputs.args }}

#@if lint
  # ── Lint ────────────────────────────────────────────────────────────────────
  # Static analysis needs no generated files, so it fails fast in parallel.
  lint:
    name: Lint
    runs-on: __OM_RUNNER__
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup

      - name: Lint
        run: yarn lint

#@endif
  # ── Validate ────────────────────────────────────────────────────────────────
  # The same gate an agent runs before opening a pull request
  # (.ai/agentic.config.json → validation.commands), in the same order.
  validate:
    name: Validate
    runs-on: __OM_RUNNER__
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup

      # Every registry under .mercato/generated is derived from src/modules.ts
      # and installed packages. Generating from scratch proves the app builds
      # from committed sources alone.
      - name: Generate module registries
        run: yarn generate

      # Generated output is never committed by hand. If `yarn generate` changes a
      # tracked file, the committed copy is stale or was edited manually.
      - name: Verify generation left tracked files untouched
        shell: bash
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::'yarn generate' modified tracked files. Run 'yarn generate' locally and commit the result."
            git status --short --untracked-files=no
            git --no-pager diff --stat
            exit 1
          fi

#@if typecheck
      - name: Typecheck
        run: yarn typecheck

#@endif
#@if dsCheck
      # Design-system guard: no hard-coded palette colours, arbitrary Tailwind
      # values or manual dark-mode overrides in app UI code.
      - name: Design-system check
        run: yarn ds:check

#@endif
#@if timeBombs
      # Fails on tests that assert a hard-coded future date as "still valid" —
      # they pass today and turn red on an unrelated pull request once that date
      # passes. Exceptions live in .ai/time-bomb-allowlist.json.
      - name: Check for time-bomb test literals
        run: node scripts/ci/time-bomb-scanner.mjs --fail src .ai/qa/tests

#@endif
#@if test
      - name: Unit tests
        run: __OM_TEST_COMMAND__

#@endif
#@if build
      - name: Production build
        run: yarn build

#@endif
#@if integration
  # ── Integration tests ───────────────────────────────────────────────────────
  # Boots the real app against a throwaway PostgreSQL container (testcontainers,
  # via the Docker daemon that GitHub-hosted runners provide), runs the
  # Playwright suites from src/modules/**/__integration__ and .ai/qa/tests,
  # then tears everything down. Skipped when the app has no integration specs.
  integration:
    name: Integration tests
    needs: [__OM_INTEGRATION_NEEDS__]
    runs-on: __OM_RUNNER__
    timeout-minutes: 60
    env:
      OM_INTEGRATION_APP_READY_TIMEOUT_SECONDS: '180'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect integration specs
        id: specs
        shell: bash
        run: |
          COUNT=$( { find src/modules -type d -name __integration__ -prune -exec find {} -name '*.spec.ts' \; 2>/dev/null; find .ai/qa/tests -name '*.spec.ts' 2>/dev/null; } | wc -l | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" = "0" ]; then
            echo "::notice::No integration specs found (src/modules/**/__integration__/*.spec.ts or .ai/qa/tests/**/*.spec.ts) — skipping."
          else
            echo "Found $COUNT integration spec file(s)."
          fi

      - name: Setup Node and dependencies
        if: steps.specs.outputs.count != '0'
        uses: ./.github/actions/setup

      - name: Resolve Playwright version
        if: steps.specs.outputs.count != '0'
        id: playwright
        shell: bash
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.specs.outputs.count != '0'
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        if: steps.specs.outputs.count != '0' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.specs.outputs.count != '0' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run ephemeral integration tests
        if: steps.specs.outputs.count != '0'
        run: yarn test:integration:ephemeral

      - name: Upload integration test report
        if: failure() && steps.specs.outputs.count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: .ai/qa/test-results
          if-no-files-found: ignore
          retention-days: 14

#@endif
#@if docker
  # ── Docker image ────────────────────────────────────────────────────────────
  # Builds (never pushes) the production image, so a broken Dockerfile or
  # .dockerignore is caught before a deploy. Runs on pushes and on pull
  # requests that touch the image inputs.
  docker:
    name: Docker image
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docker == 'true'
    runs-on: __OM_RUNNER__
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: __OM_DOCKERFILE__
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

#@endif
  # ── Aggregate verdict ───────────────────────────────────────────────────────
  # The one check to mark as required in branch protection. A skipped job
  # (no dependency change, no integration specs, …) counts as passed; a failed
  # or cancelled one fails this check.
  ci:
    name: CI
    if: always()
    needs: [__OM_NEEDS__]
    runs-on: __OM_RUNNER__
    timeout-minutes: 5
    steps:
      - name: Evaluate job results
        uses: actions/github-script@v9
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS)
            for (const [name, job] of Object.entries(needs)) core.info(`${name}: ${job.result}`)
            const failed = Object.keys(needs).filter((name) => ['failure', 'cancelled'].includes(needs[name].result))
            if (failed.length > 0) core.setFailed(`Failed jobs: ${failed.join(', ')}`)
