# Generated by the Open Mercato om-setup-ci skill. Documentation: docs/ci/README.md
# Regenerate with: node .ai/skills/om-setup-ci/scripts/setup-ci.mjs --force
#
# Branch protection: require the single `CI` check. It aggregates every job
# below, so adding or removing a job never needs a branch-protection change.
name: CI

on:
  push:
    branches:
__OM_BRANCH_LIST__
  pull_request:
    branches:
__OM_BRANCH_LIST__
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its previous run. Pushes to protected
# branches always run to completion so every merged commit has a verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # ── Change detection ────────────────────────────────────────────────────────
  # Decides which conditional jobs run and which commit is the "before" state
  # that the audit, secret scan and SAST compare against: the base of a pull
  # request, or the previous tip of a pushed branch.
  changes:
    name: Detect changes
    runs-on: __OM_RUNNER__
    timeout-minutes: 5
    outputs:
      base: ${{ steps.diff.outputs.base }}
      dependencies: ${{ steps.diff.outputs.dependencies }}
      docker: ${{ steps.diff.outputs.docker }}
      workflows: ${{ steps.diff.outputs.workflows }}
    steps:
      - name: Checkout repository
        uses: __OM_ACTION_CHECKOUT__
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          BASE=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          elif [ -n "$PUSH_BEFORE_SHA" ] && ! [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]] && git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
            BASE="$PUSH_BEFORE_SHA"
          fi
          if [ -n "$BASE" ]; then
            CHANGED=$(git diff --name-only "$BASE" HEAD)
          else
            CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD)
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          printf 'Compared with: %s\nChanged files:\n%s\n' "${BASE:-<none, first push>}" "$CHANGED"

          classify() {
            if printf '%s\n' "$CHANGED" | grep -Eq "$2"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          classify dependencies '(^|/)(package\.json|yarn\.lock|\.yarnrc\.yml)$|^scripts/ci/audit-ci'
          classify docker '^(Dockerfile|\.dockerignore|\.trivyignore|docker/|package\.json$|yarn\.lock$|\.yarnrc\.yml$|next\.config\.)'
          classify workflows '^\.github/'

  # ── Dependency audit (SCA) ──────────────────────────────────────────────────
  # Runs only when dependencies change, and fails only on advisories the change
  # INTRODUCES (compared with the base lockfile). Advisories already present on
  # the base branch are owned by the nightly .github/workflows/audit.yml, which
  # keeps a tracking issue open until they are fixed.
  audit:
    name: Dependency audit
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: __OM_RUNNER__
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: __OM_ACTION_CHECKOUT__
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: __OM_ACTION_SETUP_NODE__
        with:
#@if nodeVersionFile
          node-version-file: __OM_NODE_VERSION_FILE__
#@endif
#@if !nodeVersionFile
          node-version: '__OM_NODE_VERSION__'
#@endif

      # The audit reads yarn.lock and queries the npm advisory database directly,
      # so it needs no `yarn install`. It fails closed when advisory data cannot
      # be fetched. Justified exceptions live in scripts/ci/audit-ci-allowlist.json.
      - name: Audit dependencies for known CVEs
        shell: bash
        env:
          BASE: ${{ needs.changes.outputs.base }}
        run: |
          set -uo pipefail
          ARGS=()
          if [ -n "$BASE" ] && git show "$BASE:yarn.lock" > "$RUNNER_TEMP/baseline-yarn.lock" 2>/dev/null; then
            echo "Auditing against the baseline yarn.lock from $BASE."
            ARGS=(--baseline "$RUNNER_TEMP/baseline-yarn.lock")
          else
            echo "::notice::No baseline yarn.lock available, auditing strictly."
          fi
          node scripts/ci/audit-ci.mjs --severity __OM_AUDIT_SEVERITY__ "${ARGS[@]}"

#@if secrets
  # ── Secret scan ─────────────────────────────────────────────────────────────
  # Gitleaks scans every commit the change adds — not just the final tree — so
  # a key committed and then deleted in a later commit is still caught. The
  # nightly .github/workflows/security.yml scans the full history.
  secrets:
    name: Secret scan
    needs: changes
    runs-on: __OM_RUNNER__
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: __OM_ACTION_CHECKOUT__
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        uses: ./.github/actions/gitleaks

      - name: Scan new commits for secrets
        shell: bash
        env:
          BASE: ${{ needs.changes.outputs.base }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "$BASE" ]; then
            echo "Scanning commits $BASE..HEAD."
            ARGS=(--log-opts="$BASE..HEAD")
          else
            echo "No base commit, scanning the full history."
          fi
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git --no-banner --redact --verbose "${ARGS[@]}" .

#@endif
#@if sast
  # ── Static analysis (SAST) ──────────────────────────────────────────────────
  # Semgrep over the app code in src/. Fails only on findings the change
  # INTRODUCES (`--baseline-commit`):
  #   • Open Mercato rules (scripts/ci/semgrep/open-mercato.yml), every severity;
  #   • Semgrep registry `p/default`, ERROR severity only (its warnings are
  #     mostly noise on Next.js code).
  # Silence a reviewed false positive with `// nosemgrep: <rule-id>` and a reason.
  sast:
    name: Static analysis
    needs: changes
    runs-on: __OM_RUNNER__
    timeout-minutes: 20
#@if codeScanning
    permissions:
      contents: read
      security-events: write
#@endif
    steps:
      - name: Checkout repository
        uses: __OM_ACTION_CHECKOUT__
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Semgrep
        shell: bash
        env:
          BASE: ${{ needs.changes.outputs.base }}
          SEMGREP_IMAGE: __OM_SEMGREP_IMAGE__
        run: |
          set -uo pipefail
          mkdir -p semgrep-sarif
          BASELINE=()
          if [ -n "$BASE" ]; then
            echo "Reporting only findings introduced since $BASE."
            BASELINE=(--baseline-commit "$BASE")
          fi
          run_semgrep() {
            docker run --rm -v "$PWD:/src" -w /src \
              -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src \
              "$SEMGREP_IMAGE" semgrep scan --metrics=off --error \
              --exclude '**/__tests__/**' --exclude '**/__integration__/**' \
              --exclude '*.test.*' --exclude '*.spec.*' \
              "${BASELINE[@]}" "$@" src
          }
          STATUS=0
          echo "::group::Open Mercato rules"
          run_semgrep --config scripts/ci/semgrep/open-mercato.yml --sarif-output=semgrep-sarif/open-mercato.sarif || STATUS=1
          echo "::endgroup::"
          echo "::group::Semgrep registry p/default (ERROR severity)"
          run_semgrep --config p/default --severity ERROR --sarif-output=semgrep-sarif/default.sarif || STATUS=1
          echo "::endgroup::"
          exit "$STATUS"

#@if codeScanning
      - name: Upload Semgrep results to code scanning
        if: always()
        uses: __OM_ACTION_UPLOAD_SARIF__
        with:
          sarif_file: semgrep-sarif
          category: semgrep

#@endif
#@endif
#@if workflowLint
  # ── Workflow security ───────────────────────────────────────────────────────
  # zizmor audits the GitHub Actions workflows themselves: expression
  # injection, over-broad token permissions, credential persistence, cache
  # poisoning, unpinned actions. Runs when .github/ changes, and on pushes.
  workflow-lint:
    name: Workflow security
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.workflows == 'true'
    runs-on: __OM_RUNNER__
    timeout-minutes: 10
#@if codeScanning
    permissions:
      contents: read
      security-events: write
#@endif
    steps:
      - name: Checkout repository
        uses: __OM_ACTION_CHECKOUT__
        with:
          persist-credentials: false

#@if codeScanning
      # SARIF mode never fails the job, so the blocking run below stays separate.
      - name: Upload zizmor results to code scanning
        uses: __OM_ACTION_ZIZMOR__
        with:
          inputs: .github
          version: '__OM_ZIZMOR_VERSION__'
          min-severity: medium
          advanced-security: true

#@endif
      - name: Run zizmor
        uses: __OM_ACTION_ZIZMOR__
        with:
          inputs: .github
          version: '__OM_ZIZMOR_VERSION__'
          min-severity: medium
          advanced-security: false

#@endif
#@if lint
  # ── Lint ────────────────────────────────────────────────────────────────────
  # Static analysis needs no generated files, so it fails fast in parallel.
  lint:
    name: Lint
    runs-on: __OM_RUNNER__
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: __OM_ACTION_CHECKOUT__
        with:
          persist-credentials: false

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup

      - name: Lint
        run: yarn lint

#@endif
  # ── Validate ────────────────────────────────────────────────────────────────
  # The same gate an agent runs before opening a pull request
  # (.ai/agentic.config.json → validation.commands), in the same order.
  validate:
    name: Validate
    runs-on: __OM_RUNNER__
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: __OM_ACTION_CHECKOUT__
        with:
          persist-credentials: false

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup

      # Every registry under .mercato/generated is derived from src/modules.ts
      # and installed packages. Generating from scratch proves the app builds
      # from committed sources alone.
      - name: Generate module registries
        run: yarn generate

      # Generated output is never committed by hand. If `yarn generate` changes a
      # tracked file, the committed copy is stale or was edited manually.
      - name: Verify generation left tracked files untouched
        shell: bash
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::'yarn generate' modified tracked files. Run 'yarn generate' locally and commit the result."
            git status --short --untracked-files=no
            git --no-pager diff --stat
            exit 1
          fi

#@if typecheck
      - name: Typecheck
        run: yarn typecheck

#@endif
#@if dsCheck
      # Design-system guard: no hard-coded palette colours, arbitrary Tailwind
      # values or manual dark-mode overrides in app UI code.
      - name: Design-system check
        run: yarn ds:check

#@endif
#@if timeBombs
      # Fails on tests that assert a hard-coded future date as "still valid":
      # they pass today and turn red on an unrelated pull request once that date
      # passes. Exceptions live in .ai/time-bomb-allowlist.json.
      - name: Check for time-bomb test literals
        run: node scripts/ci/time-bomb-scanner.mjs --fail src .ai/qa/tests

#@endif
#@if test
      - name: Unit tests
        run: __OM_TEST_COMMAND__

#@endif
#@if build
      - name: Production build
        run: yarn build

#@endif
#@if integration
  # ── Integration tests ───────────────────────────────────────────────────────
  # Boots the real app against a throwaway PostgreSQL container (testcontainers,
  # via the Docker daemon that GitHub-hosted runners provide), runs the
  # Playwright suites from src/modules/**/__integration__ and .ai/qa/tests,
  # then tears everything down. Skipped when the app has no integration specs.
  integration:
    name: Integration tests
    needs: [__OM_INTEGRATION_NEEDS__]
    runs-on: __OM_RUNNER__
    timeout-minutes: 60
    env:
      OM_INTEGRATION_APP_READY_TIMEOUT_SECONDS: '180'
    steps:
      - name: Checkout repository
        uses: __OM_ACTION_CHECKOUT__
        with:
          persist-credentials: false

      - name: Detect integration specs
        id: specs
        shell: bash
        run: |
          COUNT=$( { find src/modules -type d -name __integration__ -prune -exec find {} -name '*.spec.ts' \; 2>/dev/null; find .ai/qa/tests -name '*.spec.ts' 2>/dev/null; } | wc -l | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" = "0" ]; then
            echo "::notice::No integration specs found (src/modules/**/__integration__/*.spec.ts or .ai/qa/tests/**/*.spec.ts), skipping."
          else
            echo "Found $COUNT integration spec file(s)."
          fi

      - name: Setup Node and dependencies
        if: steps.specs.outputs.count != '0'
        uses: ./.github/actions/setup

      - name: Install Playwright browser
        if: steps.specs.outputs.count != '0'
        uses: ./.github/actions/playwright

      - name: Run ephemeral integration tests
        if: steps.specs.outputs.count != '0'
        run: yarn test:integration:ephemeral

      - name: Upload integration test report
        if: failure() && steps.specs.outputs.count != '0'
        uses: __OM_ACTION_UPLOAD_ARTIFACT__
        with:
          name: integration-test-results
          path: .ai/qa/test-results
          if-no-files-found: ignore
          retention-days: 14

#@endif
#@if docker
  # ── Docker image ────────────────────────────────────────────────────────────
  # Builds (never pushes) the production image, so a broken Dockerfile or
  # .dockerignore is caught before a deploy. Runs on pushes and on pull
  # requests that touch the image inputs.
  docker:
    name: Docker image
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docker == 'true'
    runs-on: __OM_RUNNER__
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: __OM_ACTION_CHECKOUT__
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: __OM_ACTION_SETUP_BUILDX__

      - name: Build production image
        uses: __OM_ACTION_BUILD_PUSH__
        with:
          context: .
          file: __OM_DOCKERFILE__
          push: false
          load: true
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

#@if imageScan
      # Trivy covers what the npm audit cannot see: OS packages in the base
      # image. Fails on HIGH/CRITICAL vulnerabilities that have a fix available.
      # npm packages inside the image are left to the dependency audit; the
      # nightly security workflow scans both. Exceptions: .trivyignore.
      - name: Scan image OS packages
        shell: bash
        env:
          TRIVY_IMAGE: __OM_TRIVY_IMAGE__
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" -w /work "$TRIVY_IMAGE" \
            image --no-progress --skip-version-check --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --pkg-types os app:ci

#@endif
#@endif
  # ── Aggregate verdict ───────────────────────────────────────────────────────
  # The one check to mark as required in branch protection. A skipped job
  # (no dependency change, no integration specs, …) counts as passed; a failed
  # or cancelled one fails this check.
  ci:
    name: CI
    if: always()
    needs: [__OM_NEEDS__]
    runs-on: __OM_RUNNER__
    timeout-minutes: 5
    steps:
      - name: Evaluate job results
        uses: __OM_ACTION_GITHUB_SCRIPT__
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS)
            for (const [name, job] of Object.entries(needs)) core.info(`${name}: ${job.result}`)
            const failed = Object.keys(needs).filter((name) => ['failure', 'cancelled'].includes(needs[name].result))
            if (failed.length > 0) core.setFailed(`Failed jobs: ${failed.join(', ')}`)
