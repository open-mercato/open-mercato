<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Scheduled maintenance</title>
<meta http-equiv="refresh" content="300"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f7f7f8;--card:#fff;--fg:#18181b;--muted:#71717a;--border:#e4e4e7;--info-bg:#eff6ff;--info-fg:#1d4ed8}
@media (prefers-color-scheme:dark){:root{--bg:#09090b;--card:#18181b;--fg:#fafafa;--muted:#a1a1aa;--border:#27272a;--info-bg:#172554;--info-fg:#93c5fd}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(520px,92vw);background:var(--card);border:1px solid var(--border);border-radius:12px;padding:40px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.logo{width:44px;height:44px;border-radius:10px;background:var(--fg);color:var(--card);display:inline-grid;place-items:center;font-weight:700;margin-bottom:20px}
h1{font-size:24px;margin:0 0 8px}p{margin:0 0 16px;color:var(--muted)}
.eta{display:inline-block;background:var(--info-bg);color:var(--info-fg);border-radius:999px;padding:6px 14px;font-size:14px;margin-top:8px}
footer{margin-top:24px;font-size:12px;color:var(--muted)}
</style></head><body><main role="main">
<div class="logo" aria-hidden="true">OM</div>
<h1>We'll be back shortly</h1>
<p>We're performing scheduled maintenance to improve the platform. Your data is safe — please try again in a few minutes.</p>
<span class="eta">Expected back at 02:00 (in about 45 minutes)</span>
<footer>HTTP 503 · Retry-After: 2700 s</footer>
</main></body></html>
