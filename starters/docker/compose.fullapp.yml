

services:
  business-harness:
    build:
      context: .
      dockerfile: packages/business-harness/Dockerfile
    image: open-mercato-business-harness:${DEPLOY_ENV:-local}
    container_name: mercato-business-harness-${DEPLOY_ENV:-local}
    restart: unless-stopped
    environment:
      # Shared bearer for POST /v1/runs. Required: a published default would be a
      # forgeable secret, the same reason JWT_SECRET below is `:?` and not `:-`.
      HARNESS_SERVICE_TOKEN: "${BUSINESS_HARNESS_SERVICE_TOKEN:?set BUSINESS_HARNESS_SERVICE_TOKEN in the .env file next to this compose file - generate one with: openssl rand -hex 32}"
      HARNESS_CREDENTIAL_MODE: broker
      HARNESS_CREDENTIAL_BROKER_URL: http://app:3000/api/agent_orchestrator/internal/credentials/exchange
      HARNESS_CONFIG_FILE: /workspace/packages/business-harness/harness.config.compose.json
      HARNESS_HOST: 0.0.0.0
      HARNESS_PORT: 4300
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4300/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - mercato-network-fullapp

  mcp:
    image: open-mercato/app:${DEPLOY_ENV:-local}
    container_name: mercato-mcp-${DEPLOY_ENV:-local}
    restart: unless-stopped
    user: "0"
    command:
      - /bin/sh
      - -lc
      - |
        if [ ! -f /app/docker/scripts/mcp-entrypoint.sh ]; then
          echo "ERROR: mcp-entrypoint.sh not found. Please rebuild the container: docker compose build --no-cache app"
          exit 1
        fi
        sh /app/docker/scripts/mcp-entrypoint.sh
    volumes:
      - mcp_shared:/run/mcp-shared
    environment:
      # The image (Dockerfile `runner` stage) is a production build installed with
      # `yarn workspaces focus --production`. The Next server child is insulated (the CLI forces
      # NODE_ENV=production for it), but pinning `development` here still leaked into every other
      # process in the container: `mercato init`, migrations, the worker supervisor, the scheduler,
      # and the whole MCP sidecar.
      NODE_ENV: ${NODE_ENV:-production}
      NODE_OPTIONS: ${MCP_NODE_OPTIONS:---max-old-space-size=2048}
      DEPLOY_ENV: ${DEPLOY_ENV:-local}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@mercato-postgres-${DEPLOY_ENV:-local}:5432/${POSTGRES_DB:-open-mercato}
      CACHE_REDIS_URL: redis://mercato-redis-${DEPLOY_ENV:-local}:6379
      CACHE_STRATEGY: redis
      AUTO_SPAWN_WORKERS: "false"
      AUTO_SPAWN_SCHEDULER: "false"
      MEILISEARCH_HOST: http://mercato-meilisearch-${DEPLOY_ENV:-local}:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_MASTER_KEY:-meilisearch-dev-key}
      # No default: a published fallback secret lets anyone forge tokens for this deployment.
      # Set JWT_SECRET in the .env file next to this compose file (`openssl rand -hex 32`).
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in the .env file next to this compose file - generate one with: openssl rand -hex 32}"
      JWT_LEGACY_GRACE_MINUTES: "${JWT_LEGACY_GRACE_MINUTES:-480}"
      JWT_LEGACY_CUTOVER_AT: "${JWT_LEGACY_CUTOVER_AT:-}"
      # Code Mode api.request() must call back into the app over service DNS.
      # NEXT_PUBLIC_* are pinned so a stray .env cannot hijack the base URL.
      APP_URL: http://app:${CONTAINER_PORT:-3000}
      NEXT_PUBLIC_APP_URL: http://app:${CONTAINER_PORT:-3000}
      NEXT_PUBLIC_API_BASE_URL: ""
      # Session-token (tier 2) decryption requires the app's encryption config.
      TENANT_DATA_ENCRYPTION: ${TENANT_DATA_ENCRYPTION:-true}
      TENANT_DATA_ENCRYPTION_DEBUG: ${TENANT_DATA_ENCRYPTION_DEBUG:-false}
      TENANT_DATA_ENCRYPTION_FALLBACK_KEY: ${TENANT_DATA_ENCRYPTION_FALLBACK_KEY:-dev-tenant-encryption-fallback-key-32chars}
      TENANT_DATA_ENCRYPTION_KEY: ${TENANT_DATA_ENCRYPTION_KEY:-}
      OM_INIT_SUPERADMIN_EMAIL: ${OM_INIT_SUPERADMIN_EMAIL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      MCP_PORT: "3001"
      MCP_SERVER_API_KEY_FILE: /run/mcp-shared/mcp-api-key
      MCP_WAIT_FOR_APP_TIMEOUT: ${MCP_WAIT_FOR_APP_TIMEOUT:-1800}
      MCP_DEBUG: ${MCP_DEBUG:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      app:
        condition: service_healthy
    # Visibility only (compose ps / smoke tests): startup ordering is owned by
    # the entrypoint wait loops, not by this healthcheck.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 900s
    networks:
      - mercato-network-fullapp

  # Traefik (TLS termination, on-demand ACME, custom-domain ForwardAuth gate)
  # is now an opt-in overlay so this base file works behind an external reverse
  # proxy (Dokploy, Caddy, nginx, Cloudflare Tunnel, etc.) without conflict.
  # To run the bundled Traefik, add `-f starters/docker/compose.fullapp.traefik.yml`.

  app:
    build:
      context: .
      args:
        - CONTAINER_PORT=${CONTAINER_PORT:-3000}
        # Optional internal Alpine mirror for proxy-blocked corporate networks
        # (empty = official CDN; see the Dockerfile builder stage comment).
        - ALPINE_MIRROR=${ALPINE_MIRROR:-}
        - INSTALL_CHROMIUM=${INSTALL_CHROMIUM:-0}
        # Optional: browser-reachable ws(s):// endpoint baked in at build time.
        # Leave unset to disable realtime document collaboration (the editor
        # falls back to single-user editing). Invalid production values are
        # ignored at runtime instead of failing the image build.
        - NEXT_PUBLIC_DOCUMENTS_COLLAB_URL=${NEXT_PUBLIC_DOCUMENTS_COLLAB_URL:-}
    image: open-mercato/app:${DEPLOY_ENV:-local}
    # Without a restart policy the app stays down after a daemon/host reboot
    # while mcp and the business harness wait on it forever.
    restart: unless-stopped
    user: "0"
    command:
      - /bin/sh
      - -lc
      - |
        if [ ! -f /app/docker/scripts/init-or-migrate.sh ]; then
          echo "ERROR: init-or-migrate.sh not found. Please rebuild the container: docker compose build --no-cache app"
          exit 1
        fi
        INIT_COMMAND='yarn mercato init' sh /app/docker/scripts/init-or-migrate.sh
        yarn start
    volumes:
      - init_marker:/tmp/init-marker
      - attachments_storage:/app/apps/mercato/storage
      - mcp_shared:/run/mcp-shared:ro
    working_dir: /app/apps/mercato
    ports:
      - "${APP_PORT:-3000}:${CONTAINER_PORT:-3000}"
    # Traefik labels are declared in compose.fullapp.traefik.yml so
    # external reverse proxies (Dokploy, etc.) that also watch the Docker
    # socket don't accidentally pick them up.
    environment:
      TENANT_DATA_ENCRYPTION: ${TENANT_DATA_ENCRYPTION:-true}
      TENANT_DATA_ENCRYPTION_DEBUG: ${TENANT_DATA_ENCRYPTION_DEBUG:-false}
      TENANT_DATA_ENCRYPTION_FALLBACK_KEY: ${TENANT_DATA_ENCRYPTION_FALLBACK_KEY:-dev-tenant-encryption-fallback-key-32chars}
      # The image (Dockerfile `runner` stage) is a production build installed with
      # `yarn workspaces focus --production`. The Next server child is insulated (the CLI forces
      # NODE_ENV=production for it), but pinning `development` here still leaked into every other
      # process in the container: `mercato init`, migrations, the worker supervisor, the scheduler,
      # and the whole MCP sidecar.
      NODE_ENV: ${NODE_ENV:-production}
      # Prevents V8 from growing toward total host RAM before GC kicks in.
      # Override in .env to tune for your host: --max-old-space-size=6144 suits 16 GB+ servers.
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=3072}
      DEPLOY_ENV: ${DEPLOY_ENV:-local}
      PORT: ${CONTAINER_PORT:-3000}
      # Bind on all interfaces so Docker's published-port forwarding can reach
      # the server; next start otherwise honors the container's HOSTNAME and
      # binds an address unreachable from the host.
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@mercato-postgres-${DEPLOY_ENV:-local}:5432/${POSTGRES_DB:-open-mercato}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_ACQUIRE_TIMEOUT: ${DB_POOL_ACQUIRE_TIMEOUT:-6000}
      DB_POOL_IDLE_TIMEOUT: ${DB_POOL_IDLE_TIMEOUT:-3000}
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-120000}
      # No default: a published fallback secret lets anyone forge tokens for this deployment.
      # Set JWT_SECRET in the .env file next to this compose file (`openssl rand -hex 32`).
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in the .env file next to this compose file - generate one with: openssl rand -hex 32}"
      JWT_LEGACY_GRACE_MINUTES: "${JWT_LEGACY_GRACE_MINUTES:-480}"
      JWT_LEGACY_CUTOVER_AT: "${JWT_LEGACY_CUTOVER_AT:-}"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      CONSENT_INTEGRITY_SECRET: ${CONSENT_INTEGRITY_SECRET:-}
      # Set APP_URL to the public application origin in production deployments.
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Optional: unset disables realtime document collaboration (single-user editing keeps working).
      NEXT_PUBLIC_DOCUMENTS_COLLAB_URL: ${NEXT_PUBLIC_DOCUMENTS_COLLAB_URL:-}
      # Required only when collaboration is enabled: a unique high-entropy shared secret
      # (>= 32 UTF-8 bytes). The sidecar fails closed at runtime when it is missing or too short.
      DOCUMENTS_COLLAB_JWT_SECRET_V2: ${DOCUMENTS_COLLAB_JWT_SECRET_V2:-}
      # Additional trusted app/dev origins for the Open Mercato origin allowlist (resolveAllowedDevOrigins)
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-}
      REDIS_URL: ${REDIS_URL:-}
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-}
      QUEUE_STRATEGY: ${QUEUE_STRATEGY:-local}
      NEXT_PUBLIC_QUEUE_STRATEGY: ${NEXT_PUBLIC_QUEUE_STRATEGY:-local}
      CACHE_REDIS_URL: redis://mercato-redis-${DEPLOY_ENV:-local}:6379
      CACHE_STRATEGY: redis
      RATE_LIMIT_STRATEGY: ${RATE_LIMIT_STRATEGY:-memory}
      OM_MULTI_INSTANCE: ${OM_MULTI_INSTANCE:-false}
      OM_INSTANCE_COUNT: ${OM_INSTANCE_COUNT:-1}
      ENABLE_CRUD_API_CACHE: ${ENABLE_CRUD_API_CACHE:-true}
      OM_AI_PROVIDER: ${OM_AI_PROVIDER:-openai}
      OM_AI_MODEL: ${OM_AI_MODEL:-gpt-5-mini}
      OM_BUSINESS_HARNESS_URL: http://business-harness:4300
      OM_BUSINESS_HARNESS_TRANSPORT: http
      BUSINESS_HARNESS_SERVICE_TOKEN: "${BUSINESS_HARNESS_SERVICE_TOKEN:?set BUSINESS_HARNESS_SERVICE_TOKEN in the .env file next to this compose file - generate one with: openssl rand -hex 32}"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_BASE_URL: ${AZURE_OPENAI_BASE_URL:-}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      DEEPINFRA_BASE_URL: ${DEEPINFRA_BASE_URL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      TOGETHER_BASE_URL: ${TOGETHER_BASE_URL:-}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      FIREWORKS_BASE_URL: ${FIREWORKS_BASE_URL:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      LM_STUDIO_API_KEY: ${LM_STUDIO_API_KEY:-}
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-}
      MEILISEARCH_HOST: http://mercato-meilisearch-${DEPLOY_ENV:-local}:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_MASTER_KEY:-meilisearch-dev-key}
      NEXT_PUBLIC_UPGRADE_ACTIONS_ENABLED: ${NEXT_PUBLIC_UPGRADE_ACTIONS_ENABLED:-true}
      UPGRADE_ACTIONS_ENABLED: ${UPGRADE_ACTIONS_ENABLED:-true}
      SELF_SERVICE_ONBOARDING_ENABLED: ${SELF_SERVICE_ONBOARDING_ENABLED:-true}
      DEMO_MODE: ${DEMO_MODE:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      OM_DISABLE_VECTOR_SEARCH_AUTOINDEXING: ${OM_DISABLE_VECTOR_SEARCH_AUTOINDEXING:-false}
      TENANT_DATA_ENCRYPTION_KEY: ${TENANT_DATA_ENCRYPTION_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      OM_INIT_SUPERADMIN_EMAIL: ${OM_INIT_SUPERADMIN_EMAIL:-}
      OM_INIT_SUPERADMIN_PASSWORD: ${OM_INIT_SUPERADMIN_PASSWORD:-password}
      SSO_FORCE_ROLE_ON_LOGIN: employee
      # Custom-domain routing (Phase 1–3 of portal-custom-domain spec).
      DOMAIN_CHECK_SECRET: ${DOMAIN_CHECK_SECRET:-}
      DOMAIN_RESOLVE_SECRET: ${DOMAIN_RESOLVE_SECRET:-}
      INTERNAL_APP_ORIGIN: ${INTERNAL_APP_ORIGIN:-http://app:${CONTAINER_PORT:-3000}}
      PLATFORM_DOMAINS: ${PLATFORM_DOMAINS:-localhost,${PLATFORM_PRIMARY_HOST:-openmercato.com}}
      PLATFORM_PORTAL_BASE_URL: ${PLATFORM_PORTAL_BASE_URL:-https://${PLATFORM_PRIMARY_HOST:-openmercato.com}}
      CUSTOMER_DOMAIN_ORIGIN_HEADER: ${CUSTOMER_DOMAIN_ORIGIN_HEADER:-X-Open-Mercato-Origin}
      # MCP wiring. NEXT_PUBLIC_APP_URL stays browser-resolvable, never service DNS.
      MCP_URL: ${MCP_URL:-http://mcp:3001}
      MCP_SERVER_API_KEY_FILE: /run/mcp-shared/mcp-api-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    # Gates mcp (and the traefik overlay) on the app actually serving HTTP.
    # The generous start_period covers first-boot init-or-migrate + seed.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${CONTAINER_PORT:-3000}"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 900s
    networks:
      - mercato-network-fullapp

  documents-collab:
    profiles:
      - documents-collab
    # Reuse the image built by app. A second build of the same tag with a
    # different arg set races the app build and needlessly rebuilds the repo.
    image: open-mercato/app:${DEPLOY_ENV:-local}
    command: ["yarn", "documents:collab"]
    working_dir: /app
    restart: unless-stopped
    ports:
      - "${DOCUMENTS_COLLAB_PORT:-4101}:${DOCUMENTS_COLLAB_PORT:-4101}"
    # Liveness only: any HTTP reply (including 503 when collaboration is not
    # configured) means the process is serving; a connection error means it is
    # down. Readiness would false-negative on the optional collab feature.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:'+(process.env.DOCUMENTS_COLLAB_PORT||4101)+'/healthz',r=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@mercato-postgres-${DEPLOY_ENV:-local}:5432/${POSTGRES_DB:-open-mercato}
      # Same required secret and bounded legacy-token window as the app service:
      # the sidecar boots the app container and must never fall back to a
      # published signing secret either.
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in the .env file next to this compose file - generate one with: openssl rand -hex 32}"
      JWT_LEGACY_GRACE_MINUTES: "${JWT_LEGACY_GRACE_MINUTES:-480}"
      JWT_LEGACY_CUTOVER_AT: "${JWT_LEGACY_CUTOVER_AT:-}"
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
      DOCUMENTS_COLLAB_PORT: ${DOCUMENTS_COLLAB_PORT:-4101}
      DOCUMENTS_COLLAB_REDIS_URL: redis://mercato-redis-${DEPLOY_ENV:-local}:6379
      DOCUMENTS_COLLAB_REDIS_PREFIX: ${DOCUMENTS_COLLAB_REDIS_PREFIX:-open-mercato:documents:collab:${DEPLOY_ENV:-local}}
      # Same Redis as the app so multi-instance collaboration sync works out of the box
      # (DOCUMENTS_COLLAB_REDIS_URL wins when both are set).
      REDIS_URL: redis://mercato-redis-${DEPLOY_ENV:-local}:6379
      DOCUMENTS_COLLAB_ALLOWED_ORIGINS: ${DOCUMENTS_COLLAB_ALLOWED_ORIGINS:-${APP_URL}}
      # Required only when collaboration is enabled; the sidecar fails closed when missing/too short.
      DOCUMENTS_COLLAB_JWT_SECRET_V2: ${DOCUMENTS_COLLAB_JWT_SECRET_V2:-}
      DOCUMENTS_COLLAB_JWT_SECRET: ${DOCUMENTS_COLLAB_JWT_SECRET:-}
      DOCUMENTS_COLLAB_APP_ROOT: /app/apps/mercato
      # Mirror the app service's tenant-encryption configuration so the sidecar
      # can decrypt the same data as the app.
      TENANT_DATA_ENCRYPTION: ${TENANT_DATA_ENCRYPTION:-true}
      TENANT_DATA_ENCRYPTION_DEBUG: ${TENANT_DATA_ENCRYPTION_DEBUG:-false}
      TENANT_DATA_ENCRYPTION_FALLBACK_KEY: ${TENANT_DATA_ENCRYPTION_FALLBACK_KEY:-dev-tenant-encryption-fallback-key-32chars}
      TENANT_DATA_ENCRYPTION_KEY: ${TENANT_DATA_ENCRYPTION_KEY:-}
      CACHE_REDIS_URL: redis://mercato-redis-${DEPLOY_ENV:-local}:6379
      CACHE_STRATEGY: redis
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mercato-network-fullapp

  postgres:
    image: pgvector/pgvector:pg17-trixie
    container_name: mercato-postgres-${DEPLOY_ENV:-local}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-open-mercato}
    # ports not exposed - only accessible within docker network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mercato-network-fullapp

  redis:
    image: redis:7-alpine
    container_name: mercato-redis-${DEPLOY_ENV:-local}
    restart: unless-stopped
    # ports not exposed - only accessible within docker network
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data
    command: redis-server /usr/local/etc/redis/redis.conf --maxmemory ${REDIS_MAXMEMORY:-512mb}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mercato-network-fullapp

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: mercato-meilisearch-${DEPLOY_ENV:-local}
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-meilisearch-dev-key}
      MEILI_NO_ANALYTICS: "true"
    # ports not exposed - only accessible within docker network
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mercato-network-fullapp

  localstack:
    image: localstack/localstack:latest
    container_name: mercato-localstack-${DEPLOY_ENV:-local}
    restart: unless-stopped
    profiles:
      - storage-s3
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      LOCALSTACK_HOST: localhost
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mercato-network-fullapp

volumes:
  postgres_data:
    name: mercato-postgres-data-${DEPLOY_ENV:-local}
  redis_data:
    name: mercato-redis-data-${DEPLOY_ENV:-local}
  meilisearch_data:
    name: mercato-meilisearch-data-${DEPLOY_ENV:-local}
  localstack_data:
    name: mercato-localstack-data-${DEPLOY_ENV:-local}
  init_marker:
    name: mercato-init-marker-${DEPLOY_ENV:-local}
  attachments_storage:
    name: mercato-attachments-storage-${DEPLOY_ENV:-local}
  mcp_shared:
    name: mercato-mcp-shared-${DEPLOY_ENV:-local}

networks:
  mercato-network-fullapp:
    name: mercato-network-${DEPLOY_ENV:-local}
    driver: bridge
